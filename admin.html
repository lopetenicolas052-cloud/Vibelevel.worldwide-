<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VibeLevel Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    .caja {
      max-width: 500px;
      margin: 30px auto;
      background: #222;
      padding: 25px;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
      letter-spacing: 2px;
    }

    h2 {
      margin-top: 30px;
    }

    p {
      color: #ccc;
    }

    input,
    textarea,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    input,
    textarea {
      background: white;
      color: black;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input[type="file"] {
      background: #fff;
      padding: 12px;
    }

    button {
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .botonSalir {
      background: #333;
      color: white;
      border: 1px solid #555;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    #admin {
      display: none;
    }

    #mensaje,
    #mensajeProducto {
      margin-top: 15px;
      text-align: center;
      line-height: 1.5;
    }

    .separador {
      margin: 30px 0;
      border-top: 1px solid #444;
    }

    #vistaPrevia {
      display: none;
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      margin-top: 15px;
      border-radius: 10px;
      background: #111;
    }

    .nota {
      font-size: 13px;
      color: #aaa;
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <div class="caja">

    <!-- ========================= -->
    <!-- LOGIN -->
    <!-- ========================= -->

    <div id="login">

      <h1>VibeLevel</h1>

      <p>Panel de administrador</p>

      <input
        id="email"
        type="email"
        placeholder="Correo electrónico"
        autocomplete="email"
      >

      <input
        id="password"
        type="password"
        placeholder="Contraseña"
        autocomplete="current-password"
      >

      <button id="entrar">
        ENTRAR
      </button>

      <div id="mensaje"></div>

    </div>


    <!-- ========================= -->
    <!-- PANEL ADMIN -->
    <!-- ========================= -->

    <div id="admin">

      <h1>VibeLevel Admin</h1>

      <p>
        Panel de administración
      </p>

      <div class="separador"></div>

      <h2>Añadir producto</h2>


      <!-- NOMBRE -->

      <label for="nombre">
        Nombre del producto
      </label>

      <input
        id="nombre"
        type="text"
        placeholder="Ej: VibeLevel Polo"
      >


      <!-- PRECIO -->

      <label for="precio">
        Precio
      </label>

      <input
        id="precio"
        type="number"
        step="0.01"
        placeholder="Ej: 25000"
      >


      <!-- DESCRIPCIÓN -->

      <label for="descripcion">
        Descripción
      </label>

      <textarea
        id="descripcion"
        placeholder="Describe el producto..."
      ></textarea>


      <!-- IMAGEN -->

      <label for="imagen">
        Foto del producto
      </label>

      <input
        id="imagen"
        type="file"
        accept="image/*"
      >

      <div class="nota">
        Selecciona una foto desde la galería de tu teléfono.
      </div>

      <img
        id="vistaPrevia"
        alt="Vista previa del producto"
      >


      <!-- TALLAS -->

      <label for="tallas">
        Tallas disponibles
      </label>

      <input
        id="tallas"
        type="text"
        placeholder="Ej: S,M,L,XL,XXL"
      >


      <!-- GUARDAR -->

      <button id="guardar">
        AÑADIR PRODUCTO
      </button>

      <div id="mensajeProducto"></div>


      <div class="separador"></div>


      <!-- CERRAR SESIÓN -->

      <button
        id="salir"
        class="botonSalir"
      >
        CERRAR SESIÓN
      </button>

    </div>

  </div>


  <script>

    /* ==========================================
       CONFIGURACIÓN DE SUPABASE
       ========================================== */

    const SUPABASE_URL =
      "https://yqlyxnlheoiftxhpteyb.supabase.co";


    /*
      IMPORTANTE:
      Pega aquí TU PUBLISHABLE KEY de Supabase.
    */

    const SUPABASE_KEY =
      "PEGA_AQUI_TU_PUBLISHABLE_KEY";


    const cliente =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* ==========================================
       ELEMENTOS
       ========================================== */

    const login =
      document.getElementById("login");

    const admin =
      document.getElementById("admin");

    const mensaje =
      document.getElementById("mensaje");

    const mensajeProducto =
      document.getElementById("mensajeProducto");

    const imagen =
      document.getElementById("imagen");

    const vistaPrevia =
      document.getElementById("vistaPrevia");


    /* ==========================================
       VISTA PREVIA DE LA FOTO
       ========================================== */

    imagen.addEventListener("change", function() {

      const archivo = imagen.files[0];

      if (!archivo) {

        vistaPrevia.style.display = "none";

        return;
      }


      const url =
        URL.createObjectURL(archivo);

      vistaPrevia.src = url;

      vistaPrevia.style.display = "block";

    });


    /* ==========================================
       INICIAR SESIÓN
       ========================================== */

    document
      .getElementById("entrar")
      .addEventListener("click", async function() {

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        if (email === "" || password === "") {

          mensaje.textContent =
            "❌ Introduce el correo y la contraseña.";

          return;
        }


        mensaje.textContent =
          "Comprobando...";


        const resultado =
          await cliente.auth.signInWithPassword({

            email: email,

            password: password

          });


        if (resultado.error) {

          mensaje.textContent =
            "❌ " + resultado.error.message;

          return;
        }


        mensaje.textContent = "";

        login.style.display =
          "none";

        admin.style.display =
          "block";

      });


    /* ==========================================
       AÑADIR PRODUCTO
       ========================================== */

    document
      .getElementById("guardar")
      .addEventListener("click", async function() {

        const nombre =
          document
            .getElementById("nombre")
            .value
            .trim();


        const precio =
          document
            .getElementById("precio")
            .value;


        const descripcion =
          document
            .getElementById("descripcion")
            .value
            .trim();


        const archivoImagen =
          document
            .getElementById("imagen")
            .files[0];


        const tallas =
          document
            .getElementById("tallas")
            .value
            .trim();


        /* VALIDAR NOMBRE */

        if (nombre === "") {

          mensajeProducto.textContent =
            "❌ Escribe el nombre del producto.";

          return;
        }


        /* VALIDAR IMAGEN */

        if (!archivoImagen) {

          mensajeProducto.textContent =
            "❌ Selecciona una foto del producto.";

          return;
        }


        /* COMPROBAR SESIÓN */

        const sesion =
          await cliente.auth.getSession();


        if (!sesion.data.session) {

          mensajeProducto.textContent =
            "❌ Tu sesión ha caducado. Vuelve a entrar.";

          return;
        }


        mensajeProducto.textContent =
          "📤 Subiendo imagen...";


        try {

          /* ======================================
             CREAR NOMBRE ÚNICO PARA LA IMAGEN
             ====================================== */

          const extension =
            archivoImagen.name
              .split(".")
              .pop()
              .toLowerCase();


          const nombreArchivo =
            Date.now()
            + "-"
            + Math.random()
              .toString(36)
              .substring(2)
            + "."
            + extension;


          const rutaImagen =
            "productos/"
            + nombreArchivo;


          /* ======================================
             SUBIR IMAGEN A SUPABASE STORAGE
             ====================================== */

          const subida =
            await cliente
              .storage
              .from("product-images")
              .upload(
                rutaImagen,
                archivoImagen,
                {
                  cacheControl: "3600",
                  upsert: false,
                  contentType: archivoImagen.type
                }
              );


          if (subida.error) {

            mensajeProducto.textContent =
              "❌ Error al subir la imagen: "
              + subida.error.message;

            return;
          }


          /* ======================================
             OBTENER URL PÚBLICA
             ====================================== */

          const resultadoUrl =
            cliente
              .storage
              .from("product-images")
              .getPublicUrl(rutaImagen);


          const imageUrl =
            resultadoUrl
              .data
              .publicUrl;


          mensajeProducto.textContent =
            "💾 Guardando producto...";


          /* ======================================
             GUARDAR PRODUCTO EN LA TABLA
             ====================================== */

          const resultado =
            await cliente
              .from("products")
              .insert([

                {
                  name: nombre,

                  price:
                    precio === ""
                      ? null
                      : Number(precio),

                  description:
                    descripcion,

                  image_url:
                    imageUrl,

                  sizes:
                    tallas
                }

              ]);


          /* ======================================
             COMPROBAR ERROR
             ====================================== */

          if (resultado.error) {

            mensajeProducto.textContent =
              "❌ Error al guardar el producto: "
              + resultado.error.message;

            return;
          }


          /* ======================================
             ÉXITO
             ====================================== */

          mensajeProducto.textContent =
            "✅ ¡Producto añadido correctamente!";


          /* LIMPIAR FORMULARIO */

          document
            .getElementById("nombre")
            .value = "";

          document
            .getElementById("precio")
            .value = "";

          document
            .getElementById("descripcion")
            .value = "";

          document
            .getElementById("imagen")
            .value = "";

          document
            .getElementById("tallas")
            .value = "";


          vistaPrevia.src = "";

          vistaPrevia.style.display =
            "none";


        } catch (error) {

          mensajeProducto.textContent =
            "❌ Ha ocurrido un error: "
            + error.message;

        }

      });


    /* ==========================================
       CERRAR SESIÓN
       ========================================== */

    document
      .getElementById("salir")
      .addEventListener("click", async function() {

        await cliente.auth.signOut();

        location.reload();

      });

  </script>

</body>

   </html>
