<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>VibeLevel Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif}
.box{width:min(600px,100%);margin:20px auto;background:#111;border:1px solid #292929;padding:25px}
h1{text-align:center;letter-spacing:3px}
h2{margin-top:30px}
label{display:block;margin-top:18px;margin-bottom:6px;font-size:11px;font-weight:bold;letter-spacing:1px}
input,textarea,select{width:100%;padding:13px;background:#fff;color:#000;border:0;outline:none;font-size:14px}
textarea{min-height:100px;resize:vertical}
button{width:100%;padding:14px;margin-top:15px;border:0;background:#fff;color:#000;font-weight:bold;cursor:pointer}
button:hover{opacity:.85}
.logout{background:#222;color:#fff;border:1px solid #444}
.delete{background:#260d0d;color:#ff8c8c;border:1px solid #552222}
.hidden{display:none}
.message{margin-top:15px;padding:12px;text-align:center;font-size:12px;line-height:1.5}
.success{background:#102510;color:#9cff9c}
.error{background:#250f0f;color:#ff9999}
.preview{display:none;width:100%;max-height:350px;object-fit:contain;margin-top:15px;background:#000}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;margin-top:18px}
.check input{width:auto}
hr{border:0;border-top:1px solid #292929;margin:30px 0}
.small{color:#777;font-size:11px;line-height:1.5}
.productsAdmin{display:grid;gap:12px;margin-top:15px}
.productAdmin{display:flex;gap:12px;align-items:center;background:#080808;border:1px solid #292929;padding:10px}
.productAdmin img{width:75px;height:75px;object-fit:cover;background:#000}
.productAdminInfo{flex:1;min-width:0}
.productAdminInfo strong{display:block;font-size:13px;margin-bottom:6px}
.productAdminInfo span{display:block;color:#888;font-size:11px}
.productAdmin .delete{width:auto;padding:10px 12px;margin:0;font-size:11px}
.ordersAdmin{display:grid;gap:15px;margin-top:15px}
.orderAdmin{background:#080808;border:1px solid #292929;padding:15px}
.orderTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.orderNumber{font-size:14px;font-weight:bold;letter-spacing:1px}
.orderDate{font-size:10px;color:#777;margin-top:5px}
.orderStatusBadge{font-size:9px;font-weight:bold;padding:7px 9px;background:#222}
.orderSection{border-top:1px solid #292929;margin-top:15px;padding-top:15px}
.orderSectionTitle{font-size:10px;font-weight:bold;letter-spacing:2px;margin-bottom:10px}
.orderData{font-size:11px;line-height:1.8;color:#ccc}
.orderData strong{color:#fff}
.orderItems{display:grid;gap:8px}
.orderItem{border:1px solid #292929;padding:10px;font-size:11px}
.orderItemTop{display:flex;justify-content:space-between;gap:10px}
.orderItemMeta{color:#888;font-size:10px;margin-top:5px;line-height:1.6}
.proofBtn{background:#fff;color:#000;margin-top:10px}
.orderControls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.orderControls button{grid-column:1/-1}
.modalBg{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:20px;z-index:999}
.modalBg.show{display:flex}
.proofBox{position:relative;background:#111;border:1px solid #333;width:min(700px,100%);padding:20px}
.proofBox img{display:block;width:100%;max-height:75vh;object-fit:contain;background:#000}
.closeProof{position:absolute;right:10px;top:10px;width:35px;height:35px;padding:0;margin:0;background:#fff;color:#000}
.filterGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){
.row,.orderControls,.filterGrid{grid-template-columns:1fr}
.productAdmin{align-items:flex-start}
.productAdmin .delete{width:90px}
.orderTop{flex-direction:column}
}
</style>
</head>
<body>

<div class="box" id="loginBox">
<h1>VIBELEVEL ADMIN</h1>
<label>EMAIL</label>
<input id="email" type="email" autocomplete="username">
<label>PASSWORD</label>
<input id="password" type="password" autocomplete="current-password">
<button id="loginBtn">LOGIN</button>
<div id="loginMessage" class="message"></div>
</div>

<div class="box hidden" id="adminBox">
<h1>VIBELEVEL ADMIN</h1>

<h2>PUBLICAR PRODUCTO</h2>

<label>NOMBRE</label>
<input id="name">

<div class="row">
<div>
<label>PRECIO</label>
<input id="price" type="number">
</div>
<div>
<label>PRECIO ANTERIOR</label>
<input id="old_price" type="number">
</div>
</div>

<label>CATEGORÍA</label>
<input id="category">

<label>DESCRIPCIÓN</label>
<textarea id="description"></textarea>

<label>TALLAS</label>
<input id="sizes" placeholder="S,M,L,XL,XXL">

<label>STOCK</label>
<input id="stock" type="number" value="0">

<label>IMAGEN</label>
<input id="image" type="file" accept="image/*">

<img id="preview" class="preview">

<div class="check">
<input id="is_new" type="checkbox">
<label style="margin:0">PRODUCTO NUEVO</label>
</div>

<div class="check">
<input id="is_sale" type="checkbox">
<label style="margin:0">EN OFERTA</label>
</div>

<button id="saveBtn">PUBLICAR PRODUCTO</button>
<div id="productMessage" class="message"></div>

<hr>

<h2>PRODUCTOS PUBLICADOS</h2>
<div id="adminProducts" class="productsAdmin"></div>
<div id="deleteMessage" class="message"></div>
<hr>

<h2>PEDIDOS Y PAGOS</h2>

<div class="filterGrid">
<div>
<label>ESTADO DEL PAGO</label>
<select id="paymentFilter">
<option value="ALL">TODOS</option>
<option value="PENDING">PENDIENTE</option>
<option value="PAID">PAGADO</option>
<option value="NOT_PAID">NO PAGADO</option>
</select>
</div>

<div>
<label>ESTADO DEL PEDIDO</label>
<select id="orderFilter">
<option value="ALL">TODOS</option>
<option value="NEW">NUEVO</option>
<option value="PREPARING">PREPARANDO</option>
<option value="SHIPPED">ENVIADO</option>
<option value="COMPLETED">COMPLETADO</option>
</select>
</div>
</div>

<button id="refreshOrders">ACTUALIZAR PEDIDOS</button>

<div id="ordersMessage" class="message"></div>
<div id="ordersAdmin" class="ordersAdmin"></div>

<hr>

<button id="logoutBtn" class="logout">CERRAR SESIÓN</button>

</div>

<div id="proofModal" class="modalBg">
<div class="proofBox">
<button id="closeProofBtn" class="closeProof">×</button>
<img id="proofImage">
</div>
</div>

<script>
const SUPABASE_URL="https://yqlyxnlheoiftxhpteyb.supabase.co";
const SUPABASE_KEY="sb_publishable_5VLYWrFAgEXJkWhdErOikg_vHOKIHyb";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let allOrders=[];

const loginBox=document.getElementById("loginBox");
const adminBox=document.getElementById("adminBox");
const loginMessage=document.getElementById("loginMessage");
const productMessage=document.getElementById("productMessage");
const deleteMessage=document.getElementById("deleteMessage");
const ordersMessage=document.getElementById("ordersMessage");
const ordersAdmin=document.getElementById("ordersAdmin");

function escapeHtml(v){
return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function money(n){
return Number(n||0).toLocaleString("es-ES")+" XAF";
}

function formatDate(v){
if(!v)return"";
const d=new Date(v);
return isNaN(d)?String(v):d.toLocaleString("es-ES");
}

function showAdmin(){
loginBox.classList.add("hidden");
adminBox.classList.remove("hidden");
loadAdminProducts();
loadOrders();
}

async function checkSession(){
const {data,error}=await supabaseClient.auth.getSession();
if(error){
console.error(error);
return;
}
if(data.session){
showAdmin();
}else{
loginBox.classList.remove("hidden");
adminBox.classList.add("hidden");
}
}

document.getElementById("loginBtn").addEventListener("click",async()=>{
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
loginMessage.className="message";
loginMessage.textContent="Iniciando sesión...";

const {error}=await supabaseClient.auth.signInWithPassword({email,password});

if(error){
loginMessage.className="message error";
loginMessage.textContent="❌ "+error.message;
return;
}

loginMessage.className="message success";
loginMessage.textContent="✅ Sesión iniciada.";
showAdmin();
});

document.getElementById("logoutBtn").addEventListener("click",async()=>{
await supabaseClient.auth.signOut();
location.reload();
});

document.getElementById("image").addEventListener("change",e=>{
const file=e.target.files[0];
const preview=document.getElementById("preview");

if(!file){
preview.style.display="none";
preview.src="";
return;
}

preview.src=URL.createObjectURL(file);
preview.style.display="block";
});

document.getElementById("saveBtn").addEventListener("click",saveProduct);

async function saveProduct(){
productMessage.className="message";
productMessage.textContent="";

const name=document.getElementById("name").value.trim();
const price=Number(document.getElementById("price").value||0);
const oldPrice=document.getElementById("old_price").value;
const category=document.getElementById("category").value.trim();
const description=document.getElementById("description").value.trim();
const sizes=document.getElementById("sizes").value.trim();
const stock=Number(document.getElementById("stock").value||0);
const image=document.getElementById("image").files[0];
const isNew=document.getElementById("is_new").checked;
const isSale=document.getElementById("is_sale").checked;

if(!name||!price||!image){
productMessage.className="message error";
productMessage.textContent="Completa nombre, precio e imagen.";
return;
}

try{
productMessage.textContent="Subiendo imagen...";

const extension=(image.name.split(".").pop()||"jpg").toLowerCase();
const filePath="productos/"+Date.now()+"-"+Math.random().toString(36).slice(2)+"."+extension;

const {error:uploadError}=await supabaseClient.storage
.from("product-images")
.upload(filePath,image,{
contentType:image.type,
upsert:false
});

if(uploadError)throw new Error("Error al subir imagen: "+uploadError.message);

const {data:publicData}=supabaseClient.storage
.from("product-images")
.getPublicUrl(filePath);

const imageUrl=publicData.publicUrl;

const {error:insertError}=await supabaseClient
.from("products")
.insert({
name:name,
price:price,
old_price:oldPrice?Number(oldPrice):null,
category:category,
description:description,
sizes:sizes,
stock:stock,
sold_out:stock<=0,
image_url:imageUrl,
is_new:isNew,
is_sale:isSale
});

if(insertError)throw new Error("Error guardando producto: "+insertError.message);

productMessage.className="message success";
productMessage.textContent="✅ PRODUCTO PUBLICADO CORRECTAMENTE.";

document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("old_price").value="";
document.getElementById("category").value="";
document.getElementById("description").value="";
document.getElementById("sizes").value="";
document.getElementById("stock").value="0";
document.getElementById("image").value="";
document.getElementById("preview").style.display="none";
document.getElementById("is_new").checked=false;
document.getElementById("is_sale").checked=false;

await loadAdminProducts();

}catch(error){
console.error(error);
productMessage.className="message error";
productMessage.textContent="❌ "+error.message;
}
}

async function loadAdminProducts(){
const box=document.getElementById("adminProducts");
box.innerHTML='<div class="small">Cargando productos...</div>';

const {data,error}=await supabaseClient
.from("products")
.select("*")
.order("created_at",{ascending:false});

if(error){
box.innerHTML="";
deleteMessage.className="message error";
deleteMessage.textContent="❌ "+error.message;
return;
}

if(!data||!data.length){
box.innerHTML='<div class="small">No hay productos publicados.</div>';
return;
}

box.innerHTML=data.map(p=>`
<div class="productAdmin">
<img src="${escapeHtml(p.image_url||"")}" alt="">
<div class="productAdminInfo">
<strong>${escapeHtml(p.name)}</strong>
<span>${money(p.price)}</span>
<span>Stock: ${Number(p.stock||0)}</span>
<span>${p.sold_out?"AGOTADO":"DISPONIBLE"}</span>
</div>
<button class="delete" onclick="deleteProduct('${p.id}')">ELIMINAR</button>
</div>
`).join("");
}

async function deleteProduct(id){
if(!confirm("¿Eliminar este producto?"))return;

deleteMessage.className="message";
deleteMessage.textContent="Eliminando...";

const product=await getProduct(id);

if(!product){
deleteMessage.className="message error";
deleteMessage.textContent="❌ Producto no encontrado.";
return;
}

const {error}=await supabaseClient
.from("products")
.delete()
.eq("id",id);

if(error){
deleteMessage.className="message error";
deleteMessage.textContent="❌ "+error.message;
return;
}

deleteMessage.className="message success";
deleteMessage.textContent="✅ Producto eliminado.";

await loadAdminProducts();
}

async function getProduct(id){
const {data,error}=await supabaseClient
.from("products")
.select("*")
.eq("id",id)
.single();

if(error){
console.error(error);
return null;
}

return data;
}
    async function loadOrders(){
ordersMessage.className="message";
ordersMessage.textContent="Cargando pedidos...";

const {data,error}=await supabaseClient
.from("orders")
.select("*")
.order("created_at",{ascending:false});

if(error){
console.error(error);
ordersMessage.className="message error";
ordersMessage.textContent="❌ Error cargando pedidos: "+error.message;
return;
}

allOrders=data||[];
renderOrders();
}

function renderOrders(){
const paymentFilter=document.getElementById("paymentFilter").value;
const orderFilter=document.getElementById("orderFilter").value;

const filtered=allOrders.filter(order=>{
const paymentOk=paymentFilter==="ALL"||order.payment_status===paymentFilter;
const orderOk=orderFilter==="ALL"||order.order_status===orderFilter;
return paymentOk&&orderOk;
});

if(!filtered.length){
ordersAdmin.innerHTML='<div class="small">No hay pedidos con estos filtros.</div>';
return;
}

ordersAdmin.innerHTML=filtered.map(createOrderCard).join("");
filtered.forEach(order=>loadOrderItems(order.id));
}

function createOrderCard(order){
const proof=order.payment_proof_url;

const proofButton=proof?
`<button class="proofBtn" onclick="viewProof('${escapeHtml(proof)}')">VER COMPROBANTE DE PAGO</button>`:
'<div class="small">No hay comprobante.</div>';

return`
<div class="orderAdmin">

<div class="orderTop">
<div>
<div class="orderNumber">${escapeHtml(order.order_number||"SIN NÚMERO")}</div>
<div class="orderDate">${formatDate(order.created_at)}</div>
</div>
<div class="orderStatusBadge">${escapeHtml(order.order_status||"NEW")}</div>
</div>

<div class="orderSection">
<div class="orderSectionTitle">DATOS DEL CLIENTE</div>
<div class="orderData">
<strong>Nombre:</strong> ${escapeHtml(order.customer_name)}<br>
<strong>Teléfono:</strong> ${escapeHtml(order.customer_phone)}<br>
<strong>Dirección:</strong> ${escapeHtml(order.customer_address)}
</div>
</div>

<div class="orderSection">
<div class="orderSectionTitle">PAGO</div>
<div class="orderData">
<strong>Método:</strong> ${escapeHtml(order.payment_method)}<br>
<strong>Referencia / código:</strong> ${escapeHtml(order.payment_reference)}<br>
<strong>Estado:</strong> ${escapeHtml(order.payment_status)}
</div>
${proofButton}
</div>

<div class="orderSection">
<div class="orderSectionTitle">ENVÍO Y TOTAL</div>
<div class="orderData">
<strong>Método:</strong> ${escapeHtml(order.shipping_method)}<br>
<strong>Envío:</strong> ${money(order.shipping_cost)}<br>
<strong>Subtotal:</strong> ${money(order.subtotal)}<br>
<strong>TOTAL:</strong> ${money(order.total)}
</div>
</div>

<div class="orderSection">
<div class="orderSectionTitle">PRODUCTOS</div>
<div id="items-${order.id}" class="orderItems">
<div class="small">Cargando productos...</div>
</div>
</div>

<div class="orderSection">
<div class="orderSectionTitle">ACTUALIZAR PEDIDO</div>

<div class="orderControls">

<div>
<label>ESTADO DEL PAGO</label>
<select id="payment-${order.id}">
<option value="PENDING" ${order.payment_status==="PENDING"?"selected":""}>PENDING</option>
<option value="PAID" ${order.payment_status==="PAID"?"selected":""}>PAID</option>
<option value="NOT_PAID" ${order.payment_status==="NOT_PAID"?"selected":""}>NOT PAID</option>
</select>
</div>

<div>
<label>ESTADO DEL PEDIDO</label>
<select id="status-${order.id}">
<option value="NEW" ${order.order_status==="NEW"?"selected":""}>NEW</option>
<option value="PREPARING" ${order.order_status==="PREPARING"?"selected":""}>PREPARING</option>
<option value="SHIPPED" ${order.order_status==="SHIPPED"?"selected":""}>SHIPPED</option>
<option value="COMPLETED" ${order.order_status==="COMPLETED"?"selected":""}>COMPLETED</option>
</select>
</div>

<button onclick="saveOrder('${order.id}')">GUARDAR CAMBIOS</button>

</div>
</div>

</div>`;
}

async function loadOrderItems(orderId){
const box=document.getElementById("items-"+orderId);
if(!box)return;

const {data,error}=await supabaseClient
.from("order_items")
.select("*")
.eq("order_id",orderId);

if(error){
box.innerHTML='<div class="small">No se pudieron cargar los productos.</div>';
console.error(error);
return;
}

if(!data||!data.length){
box.innerHTML='<div class="small">Este pedido no tiene productos registrados.</div>';
return;
}

box.innerHTML=data.map(item=>`
<div class="orderItem">
<div class="orderItemTop">
<strong>${escapeHtml(item.product_name)}</strong>
<strong>${money(item.line_total)}</strong>
</div>
<div class="orderItemMeta">
Cantidad: ${Number(item.quantity||0)}<br>
Talla: ${escapeHtml(item.size||"N/A")}<br>
Precio unitario: ${money(item.unit_price)}
</div>
</div>
`).join("");
}

async function saveOrder(orderId){

const paymentStatus=document.getElementById("payment-"+orderId).value;
const orderStatus=document.getElementById("status-"+orderId).value;

ordersMessage.className="message";
ordersMessage.textContent="💾 Guardando cambios...";

try{

const {data:order,error:orderError}=await supabaseClient
.from("orders")
.select("*")
.eq("id",orderId)
.single();

if(orderError){
throw new Error("No se pudo obtener el pedido: "+orderError.message);
}

const wasAlreadyPaid=order.payment_status==="PAID";

const {error:updateError}=await supabaseClient
.from("orders")
.update({
payment_status:paymentStatus,
order_status:orderStatus
})
.eq("id",orderId);

if(updateError){
throw new Error("Error guardando el pedido: "+updateError.message);
}

if(paymentStatus==="PAID"&&!wasAlreadyPaid){

const {data:items,error:itemsError}=await supabaseClient
.from("order_items")
.select("*")
.eq("order_id",orderId);

if(itemsError){
throw new Error("No se pudieron obtener los productos del pedido: "+itemsError.message);
}

if(!items||items.length===0){
throw new Error("El pedido no tiene productos registrados.");
}

for(const item of items){

const {data:product,error:productError}=await supabaseClient
.from("products")
.select("id,name,stock")
.eq("id",item.product_id)
.single();

if(productError||!product){
throw new Error("No se encontró el producto: "+item.product_name);
}

const currentStock=Number(product.stock||0);
const quantity=Number(item.quantity||0);

if(currentStock<quantity){
throw new Error(
"Stock insuficiente para "+
item.product_name+
". Disponible: "+
currentStock+
". Solicitado: "+
quantity
);
}

const newStock=currentStock-quantity;

const {error:stockError}=await supabaseClient
.from("products")
.update({
stock:newStock,
sold_out:newStock<=0
})
.eq("id",item.product_id);

if(stockError){
throw new Error(
"Error actualizando el stock de "+
item.product_name+
": "+
stockError.message
);
}
}
}

ordersMessage.className="message success";

if(paymentStatus==="PAID"&&!wasAlreadyPaid){
ordersMessage.textContent="✅ PAGO CONFIRMADO. STOCK ACTUALIZADO CORRECTAMENTE.";
}else{
ordersMessage.textContent="✅ CAMBIOS GUARDADOS CORRECTAMENTE.";
}

await loadOrders();
await loadAdminProducts();

}catch(error){

console.error(error);
ordersMessage.className="message error";
ordersMessage.textContent="❌ "+error.message;

}
}

async function viewProof(path){

if(!path){
alert("No existe comprobante.");
return;
}

let imageUrl=path;

try{

if(!/^https?:\/\//i.test(path)){

const {data,error}=await supabaseClient
.storage
.from("payment-proofs")
.createSignedUrl(path,3600);

if(error)throw new Error(error.message);

imageUrl=data.signedUrl;
}

document.getElementById("proofImage").src=imageUrl;
document.getElementById("proofModal").classList.add("show");

}catch(error){

console.error(error);
alert("No se pudo abrir el comprobante: "+error.message);

}
}

document.getElementById("closeProofBtn").addEventListener("click",()=>{
document.getElementById("proofModal").classList.remove("show");
document.getElementById("proofImage").src="";
});

document.getElementById("proofModal").addEventListener("click",e=>{
if(e.target.id==="proofModal"){
document.getElementById("proofModal").classList.remove("show");
document.getElementById("proofImage").src="";
}
});

document.getElementById("paymentFilter").addEventListener("change",renderOrders);
document.getElementById("orderFilter").addEventListener("change",renderOrders);
document.getElementById("refreshOrders").addEventListener("click",loadOrders);

supabaseClient.auth.onAuthStateChange((event,session)=>{
if(session&&!adminBox.classList.contains("hidden")){
loadOrders();
loadAdminProducts();
}
});

checkSession();
</script>
</body>
</html>
