<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>VibeLevel Central</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
box-sizing: border-box;
}

body {
margin: 0;
font-family: Arial, sans-serif;
background: #f2f2f2;
color: #111;
}

header {
background: #000;
color: #fff;
padding: 18px;
display: flex;
align-items: center;
justify-content: space-between;
}

header h1 {
margin: 0;
font-size: 21px;
}

button {
border: 0;
border-radius: 9px;
padding: 13px;
font-size: 15px;
font-weight: bold;
cursor: pointer;
}

.logout {
background: #fff;
color: #000;
padding: 9px 12px;
}

.contenedor {
width: 100%;
max-width: 700px;
margin: auto;
padding: 18px;
}

.tarjeta {
background: #fff;
border-radius: 15px;
padding: 20px;
margin-bottom: 18px;
box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.bienvenida h2 {
margin-top: 0;
}

.titulo {
font-size: 19px;
font-weight: bold;
margin-bottom: 18px;
}

label {
display: block;
font-weight: bold;
margin-top: 14px;
margin-bottom: 6px;
}

input,
textarea {
width: 100%;
padding: 13px;
border: 1px solid #ccc;
border-radius: 9px;
font-size: 15px;
}

textarea {
min-height: 100px;
resize: vertical;
}

.boton-principal {
width: 100%;
margin-top: 18px;
background: #000;
color: #fff;
}

.boton-secundario {
width: 100%;
margin-top: 10px;
background: #e5e5e5;
color: #000;
}

.mensaje {
text-align: center;
font-weight: bold;
margin-top: 14px;
}

.producto {
background: #fafafa;
border: 1px solid #ddd;
border-radius: 13px;
padding: 14px;
margin-top: 15px;
}

.producto img {
width: 100%;
max-height: 320px;
object-fit: cover;
border-radius: 10px;
display: block;
margin-bottom: 12px;
}

.producto h3 {
margin: 5px 0 10px;
font-size: 19px;
}

.precio {
font-weight: bold;
font-size: 18px;
margin-bottom: 8px;
}

.dato {
margin: 7px 0;
color: #444;
line-height: 1.4;
}

.acciones {
display: flex;
gap: 8px;
margin-top: 15px;
}

.acciones button {
flex: 1;
}

.editar {
background: #ddd;
color: #000;
}

.eliminar {
background: #000;
color: #fff;
}

.oculto {
display: none;
}

#login {
max-width: 420px;
margin: 70px auto;
background: #fff;
padding: 25px;
border-radius: 17px;
box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

#login h1 {
text-align: center;
margin-bottom: 5px;
}

#login p {
text-align: center;
color: #666;
}

</style>

</head>


<body>


<!-- LOGIN -->

<div id="login">

<h1>VibeLevel</h1>

<p>🔐 Central de administración</p>

<label>📧 Correo electrónico</label>

<input
id="email"
type="email"
placeholder="Tu correo"
>

<label>🔑 Contraseña</label>

<input
id="password"
type="password"
placeholder="Tu contraseña"
>

<button
id="botonEntrar"
class="boton-principal"
>
ENTRAR
</button>

<div
id="mensajeLogin"
class="mensaje"
></div>

</div>


<!-- CENTRAL -->

<div
id="central"
class="oculto"
>

<header>

<h1>VibeLevel Central</h1>

<button
id="botonSalir"
class="logout"
>
🚪 Salir
</button>

</header>


<div class="contenedor">


<!-- BIENVENIDA -->

<div class="tarjeta bienvenida">

<h2>👋 Bienvenido</h2>

<p>
Has iniciado sesión correctamente.
</p>

<p>
Desde aquí puedes administrar todos
los productos de VibeLevel.
</p>

</div>


<!-- AÑADIR -->

<div class="tarjeta">

<div class="titulo">
➕ Añadir producto
</div>

<label>
👕 Nombre del producto
</label>

<input
id="nombre"
type="text"
placeholder="Nombre de la prenda"
>


<label>
💰 Precio en XAF
</label>

<input
id="precio"
type="number"
placeholder="Ej: 15000"
>


<label>
📏 Tallas
</label>

<input
id="tallas"
type="text"
placeholder="S, M, L, XL, XXL"
>


<label>
📝 Descripción
</label>

<textarea
id="descripcion"
placeholder="Descripción de la prenda"
></textarea>


<label>
🖼️ Imagen
</label>

<input
id="imagen"
type="text"
placeholder="Enlace de la imagen"
>


<button
id="botonGuardar"
class="boton-principal"
>
➕ GUARDAR PRODUCTO
</button>


<button
id="botonCancelar"
class="boton-secundario oculto"
>
❌ CANCELAR EDICIÓN
</button>


<div
id="mensajeProducto"
class="mensaje"
></div>

</div>


<!-- PRODUCTOS -->

<div class="tarjeta">

<div class="titulo">
📦 Todos los productos
</div>

<button
id="botonActualizar"
class="boton-secundario"
>
🔄 Actualizar lista
</button>

<div id="listaProductos">

<p>Cargando productos...</p>

</div>

</div>


</div>

</div>


<script>


/* =========================
   CONEXIÓN SUPABASE
========================= */

var SUPABASE_URL =
"https://yqlyxnlheoiftxhpteyb.supabase.co";

var SUPABASE_KEY =
"sb_publishable_5VLYWrFAgEXJkWhdErOikg_vHOKIHyb";


var cliente =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   VARIABLES
========================= */

var productoEditando = null;


/* =========================
   ELEMENTOS
========================= */

var login =
document.getElementById("login");

var central =
document.getElementById("central");

var botonEntrar =
document.getElementById("botonEntrar");

var botonSalir =
document.getElementById("botonSalir");

var botonGuardar =
document.getElementById("botonGuardar");

var botonCancelar =
document.getElementById("botonCancelar");

var botonActualizar =
document.getElementById("botonActualizar");

var mensajeLogin =
document.getElementById("mensajeLogin");

var mensajeProducto =
document.getElementById("mensajeProducto");

var listaProductos =
document.getElementById("listaProductos");


/* =========================
   INICIAR SESIÓN
========================= */

botonEntrar.addEventListener(
"click",
iniciarSesion
);


async function iniciarSesion() {

var email =
document.getElementById("email").value.trim();

var password =
document.getElementById("password").value;

mensajeLogin.textContent =
"Comprobando...";

var resultado =
await cliente.auth.signInWithPassword({

email: email,

password: password

});


if (resultado.error) {

mensajeLogin.textContent =
"❌ " + resultado.error.message;

return;

}


login.style.display =
"none";

central.classList.remove("oculto");

cargarProductos();

}


/* =========================
   GUARDAR PRODUCTO
========================= */

botonGuardar.addEventListener(
"click",
guardarProducto
);


async function guardarProducto() {

var nombre =
document.getElementById("nombre").value.trim();

var precio =
document.getElementById("precio").value;

var tallas =
document.getElementById("tallas").value.trim();

var descripcion =
document.getElementById("descripcion").value.trim();

var imagen =
document.getElementById("imagen").value.trim();


if (
nombre === "" ||
precio === ""
) {

mensajeProducto.textContent =
"❌ Escribe el nombre y el precio.";

return;

}


mensajeProducto.textContent =
"⏳ Guardando...";


var resultado;


if (productoEditando === null) {


resultado =
await cliente
.from("productos")
.insert({

nombre: nombre,

precio: Number(precio),

tallas: tallas,

descripcion: descripcion,

imagen: imagen

});


} else {


resultado =
await cliente
.from("productos")
.update({

nombre: nombre,

precio: Number(precio),

tallas: tallas,

descripcion: descripcion,

imagen: imagen

})
.eq(
"id",
productoEditando
);

}


if (resultado.error) {

mensajeProducto.textContent =
"❌ " + resultado.error.message;

return;

}


if (productoEditando === null) {

mensajeProducto.textContent =
"✅ Producto añadido correctamente.";

} else {

mensajeProducto.textContent =
"✅ Producto actualizado correctamente.";

}


limpiarFormulario();

cargarProductos();

}


/* =========================
   CARGAR PRODUCTOS
========================= */

async function cargarProductos() {

listaProductos.innerHTML =
"<p>⏳ Cargando productos...</p>";


var resultado =
await cliente
.from("productos")
.select("*")
.order(
"id",
{ ascending: false }
);


if (resultado.error) {

listaProductos.innerHTML =
"<p>❌ " +
resultado.error.message +
"</p>";

return;

}


var productos =
resultado.data;


if (
!productos ||
productos.length === 0
) {

listaProductos.innerHTML =
"<p>📦 No hay productos todavía.</p>";

return;

}


listaProductos.innerHTML =
"";


for (
var i = 0;
i < productos.length;
i++
) {

crearTarjetaProducto(
productos[i]
);

}

}


/* =========================
   CREAR TARJETA
========================= */

function crearTarjetaProducto(
producto
) {

var tarjeta =
document.createElement("div");

tarjeta.className =
"producto";


if (producto.imagen) {

var imagen =
document.createElement("img");

imagen.src =
producto.imagen;

imagen.alt =
producto.nombre;

tarjeta.appendChild(
imagen
);

}


var titulo =
document.createElement("h3");

titulo.textContent =
"👕 " + producto.nombre;

tarjeta.appendChild(
titulo
);


var precio =
document.createElement("div");

precio.className =
"precio";

precio.textContent =
"💰 " +
producto.precio +
" XAF";

tarjeta.appendChild(
precio
);


var tallas =
document.createElement("div");

tallas.className =
"dato";

tallas.textContent =
"📏 Tallas: " +
(
producto.tallas ||
"No especificadas"
);

tarjeta.appendChild(
tallas
);


var descripcion =
document.createElement("div");

descripcion.className =
"dato";

descripcion.textContent =
"📝 " +
(
producto.descripcion ||
"Sin descripción"
);

tarjeta.appendChild(
descripcion
);


var acciones =
document.createElement("div");

acciones.className =
"acciones";


var botonEditar =
document.createElement("button");

botonEditar.className =
"editar";

botonEditar.textContent =
"✏️ Editar";


botonEditar.addEventListener(
"click",
function() {

editarProducto(
producto.id
);

});


var botonEliminar =
document.createElement("button");

botonEliminar.className =
"eliminar";

botonEliminar.textContent =
"🗑️ Eliminar";


botonEliminar.addEventListener(
"click",
function() {

eliminarProducto(
producto.id
);

});


acciones.appendChild(
botonEditar
);

acciones.appendChild(
botonEliminar
);

tarjeta.appendChild(
acciones
);

listaProductos.appendChild(
tarjeta
);

}


/* =========================
   EDITAR
========================= */

async function editarProducto(
id
) {

var resultado =
await cliente
.from("productos")
.select("*")
.eq("id", id)
.single();


if (resultado.error) {

alert(
"❌ No se pudo cargar el producto."
);

return;

}


var producto =
resultado.data;


productoEditando =
producto.id;


document.getElementById(
"nombre"
).value =
producto.nombre || "";


document.getElementById(
"precio"
).value =
producto.precio || "";


document.getElementById(
"tallas"
).value =
producto.tallas || "";


document.getElementById(
"descripcion"
).value =
producto.descripcion || "";


document.getElementById(
"imagen"
).value =
producto.imagen || "";


botonGuardar.textContent =
"💾 GUARDAR CAMBIOS";


botonCancelar.classList.remove(
"oculto"
);


window.scrollTo(
0,
0
);

}


/* =========================
   ELIMINAR
========================= */

async function eliminarProducto(
id
) {

var confirmar =
confirm(
"¿Seguro que quieres eliminar este producto?"
);


if (!confirmar) {

return;

}


var resultado =
await cliente
.from("productos")
.delete()
.eq("id", id);


if (resultado.error) {

alert(
"❌ " +
resultado.error.message
);

return;

}


alert(
"✅ Producto eliminado."
);


cargarProductos();

}


/* =========================
   CANCELAR EDICIÓN
========================= */

botonCancelar.addEventListener(
"click",
function() {

limpiarFormulario();

}
);


/* =========================
   LIMPIAR
========================= */

function limpiarFormulario() {

productoEditando =
null;


document.getElementById(
"nombre"
).value =
"";


document.getElementById(
"precio"
).value =
"";


document.getElementById(
"tallas"
).value =
"";


document.getElementById(
"descripcion"
).value =
"";


document.getElementById(
"imagen"
).value =
"";


botonGuardar.textContent =
"➕ GUARDAR PRODUCTO";


botonCancelar.classList.add(
"oculto"
);

}


/* =========================
   ACTUALIZAR
========================= */

botonActualizar.addEventListener(
"click",
function() {

cargarProductos();

}
);


/* =========================
   CERRAR SESIÓN
========================= */

botonSalir.addEventListener(
"click",
async function() {

await cliente.auth.signOut();

location.reload();

}
);

</script>

</body>

</html>
