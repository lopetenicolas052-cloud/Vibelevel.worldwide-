<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VibeLevel Worldwide</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #000;
      border-bottom: 1px solid #222;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      min-height: 65px;
      padding: 12px 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      color: #fff;
      text-decoration: none;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 4px;
    }

    .cart-btn {
      background: #fff;
      color: #000;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 800;
    }

    .hero {
      text-align: center;
      padding: 55px 20px 30px;
    }

    .hero h1 {
      font-size: clamp(34px, 8vw, 65px);
      letter-spacing: 7px;
      font-weight: 900;
    }

    .hero p {
      color: #aaa;
      margin-top: 12px;
    }

    .collection {
      max-width: 1200px;
      margin: auto;
      padding: 15px 18px 50px;
    }

    .collection-title {
      font-size: 26px;
      margin-bottom: 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .product {
      background: #0b0b0b;
      border: 1px solid #222;
      border-radius: 12px;
      overflow: hidden;
    }

    .product-photo {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      background: #111;
    }

    .product-body {
      padding: 14px;
    }

    .product-name {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .product-description {
      color: #999;
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .price {
      font-weight: 900;
      font-size: 19px;
    }

    .old-price {
      color: #666;
      text-decoration: line-through;
      font-size: 14px;
      margin-right: 7px;
    }

    .stars {
      margin: 8px 0;
    }

    .product-button,
    .primary-button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: #fff;
      color: #000;
      padding: 12px;
      margin-top: 10px;
      font-weight: 800;
    }

    .loading,
    .empty {
      color: #888;
      text-align: center;
      padding: 50px 20px;
      grid-column: 1 / -1;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 5000;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 15px;
      background: rgba(0, 0, 0, .85);
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 560px;
      max-height: 92vh;
      overflow-y: auto;

      background: #090909;
      border: 1px solid #333;
      border-radius: 15px;
      padding: 20px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .close {
      background: transparent;
      border: 0;
      color: #fff;
      font-size: 28px;
    }

    .detail-image {
      width: 100%;
      max-height: 500px;
      object-fit: contain;
      border-radius: 10px;
      background: #111;
    }

    label {
      display: block;
      color: #ccc;
      font-size: 14px;
      margin: 14px 0 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #111;
      color: #fff;
      outline: none;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    /* CART */

    .cart-item {
      display: flex;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #222;
    }

    .cart-item img {
      width: 75px;
      height: 75px;
      border-radius: 8px;
      object-fit: cover;
      background: #111;
    }

    .cart-info {
      flex: 1;
    }

    .cart-name {
      font-weight: 800;
      margin-bottom: 5px;
    }

    .cart-size {
      color: #aaa;
      font-size: 14px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .quantity button {
      width: 29px;
      height: 29px;
      border: 0;
      border-radius: 6px;
      background: #fff;
      color: #000;
      font-weight: 900;
    }

    .remove {
      background: transparent;
      color: #888;
      border: 0;
      margin-top: 6px;
      font-size: 13px;
    }

    .summary {
      border-top: 1px solid #333;
      margin-top: 18px;
      padding-top: 15px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
    }

    .grand-total {
      font-size: 21px;
      font-weight: 900;
      border-top: 1px solid #333;
      padding-top: 13px;
      margin-top: 13px;
    }

    .whatsapp-button {
      background: #fff;
      color: #000;
    }

    /* REVIEWS */

    .reviews {
      max-width: 1200px;
      margin: auto;
      padding: 35px 18px 55px;
      border-top: 1px solid #222;
    }

    .review {
      background: #0b0b0b;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 15px;
      margin: 10px 0;
    }

    .review-name {
      font-weight: 800;
      margin-top: 5px;
    }

    .review-text {
      color: #bbb;
      margin-top: 7px;
      line-height: 1.4;
    }

    footer {
      border-top: 1px solid #222;
      color: #666;
      text-align: center;
      padding: 35px 20px;
    }

    @media (max-width: 600px) {
      .products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .product-body {
        padding: 10px;
      }

      .product-name {
        font-size: 15px;
      }

      .product-description {
        font-size: 12px;
      }

      .price {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <a href="#" class="brand">
      VIBELEVEL
    </a>

    <button class="cart-btn" onclick="openCart()">
      🛒 Carrito
      (<span id="cartCount">0</span>)
    </button>

  </div>
</header>


<section class="hero">

  <h1>VIBELEVEL</h1>

  <p>
    Streetwear • Identity • Worldwide
  </p>

</section>


<section class="collection" id="coleccion">

  <h2 class="collection-title">
    Colección
  </h2>

  <div
    id="products"
    class="products"
  >
    <div class="loading">
      Cargando productos...
    </div>
  </div>

</section>


<section class="reviews">

  <h2>
    ⭐ Reseñas de clientes
  </h2>

  <div id="reviewsList">

  </div>

  <button
    class="primary-button"
    onclick="openReviewModal()"

    Escribir una reseña
  </button>

<footer>
  © 2026 VibeLevel Worldwide
</footer>


<!-- ==============================
     PRODUCTO
================================ -->

<div
  id="productModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="detailName">
        Producto
      </h2>

      <button
        class="close"
        onclick="closeModal('productModal')"
      >
        ×
      </button>

    </div>

    <img
      id="detailImage"
      class="detail-image"

      alt="Producto VibeLevel"
    >

    <p
      id="detailDescription"
      style="color:#aaa;margin-top:14px;"
    ></p>

    <div
      id="detailPrice"
      class="price"
      style="margin-top:10px;"
    ></div>

    <label>
      Talla
    </label>

    <select id="detailSize">

      <option value="">
        Seleccionar talla
      </option>

      <option value="XS">
        XS
      </option>

      <option value="S">
        S
      </option>

      <option value="M">
        M
      </option>

      <option value="L">

================================ -->

<div
  id="cartModal"

  <div class="modal-box">

    <div class="modal-head">

================================ -->

<div
  id="reviewModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-head">

      <h2>

    <select id="reviewStars">

        ⭐⭐⭐⭐⭐
      </option>

      <option value="4">
        ⭐⭐⭐⭐
      </option>

      <option value="3">
        ⭐⭐⭐
      </option>

      <option value="2">
        ⭐⭐
      </option>

        ⭐

</div>


<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
  "https://yqlyxnlheoiftxhpteyb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_5VLYWrFAgEXJkWhdErOikg_vHOKIHyb";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==================================================
   WHATSAPP
==================================================

   IMPORTANTE:
   Sustituye los X por tu número de WhatsApp.

   Ejemplo:
   240XXXXXXXXX

   No pongas + ni espacios.
================================================== */

const WHATSAPP_NUMBER =
  "240555626619";


/* ==================================================
   VARIABLES
================================================== */

let products = [];

let cart = [];

let selectedProduct = null;


/* ==================================================
   INICIO
================================================== */

document.addEventListener(
  "DOMContentLoaded",
  async () => {

    loadCart();

    updateCartCount();

    await loadProducts();

    await loadReviews();

  }
);


/* ==================================================
   PRODUCTOS DESDE SUPABASE
================================================== */

async function loadProducts() {

  const container =
    document.getElementById(
      "products"
    );

  container.innerHTML =
    `<div class="loading">
       Cargando productos...
     </div>`;

  try {

    const result =
      await supabaseClient
        .from("products")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );

    if (result.error) {
      throw result.error;
    }

    products =
      result.data || [];

    renderProducts();

  } catch (error) {

    console.error(
      "Error cargando productos:",
      error
    );

    container.innerHTML = `
      <div class="empty">
        No se pudieron cargar los productos.
      </div>
    `;
  }
}


/* ==================================================
   RENDER PRODUCTOS
================================================== */

function renderProducts() {

  const container =
    document.getElementById(
      "products"
    );

  if (!products.length) {

    container.innerHTML = `
      <div class="empty">
        No hay productos disponibles.
      </div>
    `;

    return;
  }

  container.innerHTML = "";

  products.forEach(product => {

    /*
      Compatible con diferentes nombres
      de columna de imagen.
    */

    const image =
      product.image_url ||
      product.image ||
      product.photo_url ||
      product.photo ||
      product.imageUrl ||
      placeholderImage();


    const name =
      product.name ||
      product.title ||
      "Producto VibeLevel";


    const description =
      product.description ||
      "";


    const price =
      Number(
        product.sale_price ??
        product.price ??
        0
      );


    const oldPrice =
      Number(
        product.old_price ??
        product.original_price ??
        0
      );


    const rating =
      Number(
        product.rating || 0
      );


    let ratingHTML = "";

    if (rating > 0) {

      ratingHTML =
        `<div class="stars">
           ${"⭐".repeat(
             Math.min(
               5,
               Math.round(rating)
             )
           )}
         </div>`;
    }


    const card =
      document.createElement(
        "article"
      );

    card.className =
      "product";


    card.innerHTML = `

      <img
        class="product-photo"
        src="${safe(image)}"
        alt="${safe(name)}"
        onerror="
          this.src='${placeholderImage()}'
        "
      >

      <div class="product-body">

        <div class="product-name">
          ${safe(name)}
        </div>

        <div class="product-description">
          ${safe(description)}
        </div>

        ${
          oldPrice > price
          ?
          `
          <div>
            <span class="old-price">
              ${formatPrice(oldPrice)} XAF
            </span>

            <span class="price">
              ${formatPrice(price)} XAF
            </span>
          </div>
          `
          :
          `
          <div class="price">
            ${formatPrice(price)} XAF
          </div>
          `
        }

        ${ratingHTML}

        <button
          class="product-button"
          onclick="openProduct('${String(product.id)}')"
        >
          Ver producto
        </button>

      </div>
    `;

    container.appendChild(card);

  });
}


/* ==================================================
   DETALLE DEL PRODUCTO
================================================== */

function openProduct(id) {

  selectedProduct =
    products.find(
      product =>
        String(product.id) ===
        String(id)
    );

  if (!selectedProduct) {
    return;
  }


  const image =
    selectedProduct.image_url ||
    selectedProduct.image ||
    selectedProduct.photo_url ||
    selectedProduct.photo ||
    selectedProduct.imageUrl ||
    placeholderImage();


  const name =
    selectedProduct.name ||
    selectedProduct.title ||
    "Producto";


  const description =
    selectedProduct.description ||
    "";


  const price =
    Number(
      selectedProduct.sale_price ??
      selectedProduct.price ??
      0
    );


  document.getElementById(
    "detailName"
  ).textContent = name;


  document.getElementById(
    "detailImage"
  ).src = image;


  document.getElementById(
    "detailDescription"
  ).textContent =
    description;


  document.getElementById(
    "detailPrice"
  ).textContent =
    formatPrice(price) +
    " XAF";


  document.getElementById(
    "detailSize"
  ).value = "";


  document.getElementById(
    "detailQuantity"
  ).value = 1;


  document.getElementById(
    "productModal"
  ).classList.add("active");
}


/* ==================================================
   AÑADIR PRODUCTO
================================================== */

function addSelectedProduct() {

  if (!selectedProduct) {
    return;
  }


  const size =
    document.getElementById(
      "detailSize"
    ).value;


  const quantity =
    Number(
      document.getElementById(
        "detailQuantity"
      ).value
    );


  if (!size) {

    alert(
      "Selecciona una talla."
    );

    return;
  }


  if (
    !quantity ||
    quantity < 1
  ) {

    alert(
      "Introduce una cantidad válida."
    );

    return;
  }


  const price =
    Number(
      selectedProduct.sale_price ??
      selectedProduct.price ??
      0
    );


  const image =
    selectedProduct.image_url ||
    selectedProduct.image ||
    selectedProduct.photo_url ||
    selectedProduct.photo ||
    selectedProduct.imageUrl ||
    placeholderImage();


  const name =
    selectedProduct.name ||
    selectedProduct.title ||
    "Producto";


  const existing =
    cart.find(
      item =>
        String(item.id) ===
        String(selectedProduct.id)
        &&
        item.size === size
    );


  if (existing) {

    existing.quantity +=
      quantity;

  } else {

    cart.push({

      id:
        selectedProduct.id,

      name:
        name,

      image:
        image,

      price:
        price,

      size:
        size,

      quantity:
        quantity

    });
  }


  saveCart();

  updateCartCount();

  closeModal(
    "productModal"
  );

  openCart();
}


/* ==================================================
   CARRITO
================================================== */

function openCart() {

  renderCart();

  document
    .getElementById(
      "cartModal"
    )
    .classList.add(
      "active"
    );
}


function renderCart() {

  const container =
    document.getElementById(
      "cartItems"
    );


  if (!cart.length) {

    container.innerHTML = `
      <div class="empty">
        Tu carrito está vacío.
      </div>
    `;

    updateTotal();

    return;
  }


  container.innerHTML = "";


  cart.forEach(
    (item, index) => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "cart-item";


      row.innerHTML = `

        <img
          src="${safe(item.image)}"
          alt="${safe(item.name)}"
          onerror="
            this.src='
