<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<title>VIBELEVEL WORLDWIDE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:1000;
    height:70px;
    background:rgba(0,0,0,.95);
    border-bottom:1px solid #222;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
}

.logo{
    color:#fff;
    text-decoration:none;
    font-size:21px;
    font-weight:900;
    letter-spacing:3px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.icon-btn{
    border:1px solid #333;
    background:#111;
    color:#fff;
    width:42px;
    height:42px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
}

.cart-count{
    position:absolute;
    margin-top:-28px;
    margin-left:28px;
    background:#fff;
    color:#000;
    min-width:18px;
    height:18px;
    border-radius:50%;
    font-size:11px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* HERO */

.hero{
    min-height:390px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:60px 20px;
    border-bottom:1px solid #1c1c1c;
    background:
        radial-gradient(circle at center,#181818 0%,#090909 40%,#000 75%);
}

.hero h1{
    font-size:clamp(42px,10vw,90px);
    font-weight:1000;
    letter-spacing:7px;
    line-height:.95;
}

.hero p{
    margin-top:20px;
    color:#aaa;
    font-size:13px;
    letter-spacing:3px;
}

/* CONTROLS */

.controls{
    padding:25px 18px;
    max-width:1300px;
    margin:auto;
}

.controls-top{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.search{
    flex:1;
    background:#111;
    border:1px solid #333;
    color:#fff;
    padding:14px 16px;
    outline:none;
    border-radius:4px;
}

.search:focus{
    border-color:#fff;
}

.refresh{
    background:#fff;
    color:#000;
    border:0;
    padding:0 18px;
    border-radius:4px;
    font-weight:bold;
}

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:5px;
}

.category{
    white-space:nowrap;
    background:#111;
    color:#aaa;
    border:1px solid #333;
    padding:9px 15px;
    border-radius:30px;
}

.category.active{
    background:#fff;
    color:#000;
}

/* COLLECTION */

.collection{
    max-width:1300px;
    margin:auto;
    padding:10px 18px 80px;
}

.section-title{
    display:flex;
    align-items:end;
    justify-content:space-between;
    margin-bottom:20px;
}

.section-title h2{
    font-size:24px;
    letter-spacing:2px;
}

.section-title span{
    color:#777;
    font-size:13px;
}

.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
}

@media(max-width:950px){
    .products{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:650px){
    .products{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }
}

/* PRODUCT */

.product{
    background:#0d0d0d;
    border:1px solid #1d1d1d;
    overflow:hidden;
    position:relative;
    transition:.2s;
}

.product:hover{
    border-color:#444;
    transform:translateY(-2px);
}

.product-image{
    aspect-ratio:3/4;
    background:#151515;
    position:relative;
    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.badges{
    position:absolute;
    top:10px;
    left:10px;
    display:flex;
    flex-direction:column;
    gap:5px;
}

.badge{
    background:#fff;
    color:#000;
    padding:5px 7px;
    font-size:9px;
    font-weight:bold;
    letter-spacing:1px;
}

.badge.sale{
    background:#000;
    color:#fff;
    border:1px solid #fff;
}

.badge.sold{
    background:#777;
    color:#fff;
}

.product-info{
    padding:13px;
}

.product-category{
    color:#777;
    font-size:9px;
    letter-spacing:1.5px;
    margin-bottom:6px;
}

.product-name{
    font-size:15px;
    font-weight:bold;
    margin-bottom:8px;
}

.prices{
    display:flex;
    align-items:center;
    gap:8px;
}

.price{
    font-size:15px;
    font-weight:bold;
}

.old-price{
    color:#666;
    text-decoration:line-through;
    font-size:12px;
}

.sizes{
    display:flex;
    gap:4px;
    margin-top:10px;
    flex-wrap:wrap;
}

.size{
    border:1px solid #333;
    padding:4px 6px;
    color:#aaa;
    font-size:9px;
}

.add{
    width:100%;
    margin-top:12px;
    border:1px solid #fff;
    background:#fff;
    color:#000;
    padding:10px;
    font-size:11px;
    font-weight:bold;
    letter-spacing:1px;
}

.add:hover{
    background:#000;
    color:#fff;
}

.add:disabled{
    background:#222;
    color:#666;
    border-color:#222;
    cursor:not-allowed;
}

/* LOADING */

.loading{
    grid-column:1/-1;
    min-height:200px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#777;
    letter-spacing:2px;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:80px 20px;
    color:#777;
}

.error{
    grid-column:1/-1;
    padding:25px;
    border:1px solid #662222;
    background:#160909;
    color:#ff9999;
    line-height:1.6;
}

/* CART */

.cart-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    z-index:2000;
    display:none;
}

.cart-overlay.open{
    display:block;
}

.cart{
    position:absolute;
    right:0;
    top:0;
    height:100%;
    width:min(430px,100%);
    background:#0b0b0b;
    border-left:1px solid #333;
    display:flex;
    flex-direction:column;
}

.cart-header{
    height:70px;
    padding:0 18px;
    border-bottom:1px solid #222;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.cart-header h3{
    letter-spacing:2px;
}

.close{
    background:none;
    border:0;
    color:#fff;
    font-size:25px;
}

.cart-items{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.cart-item{
    display:flex;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid #222;
}

.cart-item img{
    width:70px;
    height:85px;
    object-fit:cover;
    background:#151515;
}

.cart-item-info{
    flex:1;
}

.cart-item-name{
    font-weight:bold;
    font-size:14px;
}

.cart-item-size{
    color:#777;
    font-size:11px;
    margin-top:5px;
}

.cart-item-price{
    margin-top:8px;
}

.qty{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
}

.qty button{
    width:25px;
    height:25px;
    background:#171717;
    border:1px solid #333;
    color:#fff;
}

.remove{
    background:none;
    border:0;
    color:#777;
    font-size:11px;
}

.cart-bottom{
    border-top:1px solid #222;
    padding:18px;
}

.total-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
}

.total-row.shipping{
    color:#999;
}

.total-row.final{
    font-size:20px;
    font-weight:bold;
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid #333;
}

.checkout{
    width:100%;
    margin-top:15px;
    padding:15px;
    background:#fff;
    color:#000;
    border:0;
    font-weight:bold;
    letter-spacing:1px;
}

/* CHECKOUT */

.checkout-form{
    display:none;
    position:fixed;
    z-index:3000;
    inset:0;
    background:rgba(0,0,0,.8);
    align-items:center;
    justify-content:center;
    padding:15px;
}

.checkout-form.open{
    display:flex;
}

.checkout-box{
    width:min(500px,100%);
    max-height:90vh;
    overflow-y:auto;
    background:#0d0d0d;
    border:1px solid #333;
    padding:22px;
}

.checkout-box h2{
    margin-bottom:20px;
    letter-spacing:2px;
}

.field{
    margin-bottom:13px;
}

.field label{
    display:block;
    color:#999;
    font-size:11px;
    margin-bottom:6px;
}

.field input,
.field textarea,
.field select{
    width:100%;
    background:#111;
    color:#fff;
    border:1px solid #333;
    padding:12px;
    outline:none;
}

.field textarea{
    min-height:80px;
    resize:vertical;
}

.form-buttons{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.cancel{
    flex:1;
    background:#111;
    color:#fff;
    border:1px solid #333;
    padding:13px;
}

.whatsapp{
    flex:2;
    background:#fff;
    color:#000;
    border:0;
    padding:13px;
    font-weight:bold;
}

/* FOOTER */

footer{
    border-top:1px solid #222;
    text-align:center;
    padding:40px 20px;
    color:#555;
    font-size:11px;
    letter-spacing:2px;
}
</style>
</head>

<body>

<header>
    <a href="#" class="logo">VIBELEVEL</a>

    <div class="header-right">
        <button class="icon-btn" onclick="openCart()">

            <span class="cart-count" id="cartCount">0</span>
        </button>
    </div>
</header>

<section class="hero">
    <div>
        <h1>VIBELEVEL</h1>
        <p>WORLDWIDE STREETWEAR</p>
    </div>
</section>

<section class="controls">

    <div class="controls-top">
        <input
            id="search"
            class="search"
            type="text"
            placeholder="Buscar producto..."
            oninput="renderProducts()"
        >

        <button class="refresh" onclick="loadProducts()">
            ↻
        </button>
    </div>

    <div class="categories" id="categories">
        <button class="category active" onclick="setCategory('ALL',this)">
            TODOS
        </button>
    </div>

</section>

<main class="collection">

    <div class="section-title">
        <h2>COLECCIÓN</h2>
        <span id="productCount">0 productos</span>
    </div>

    <div class="products" id="products">
        <div class="loading">
            CARGANDO PRODUCTOS...
        </div>
    </div>

</main>

<footer>
    VIBELEVEL WORLDWIDE · STREETWEAR
</footer>


<!-- CART -->

<div class="cart-overlay" id="cartOverlay" onclick="closeCartOutside(event)">

    <aside class="cart">

        <div class="cart-header">
            <h3>MI CARRITO</h3>
            <button class="close" onclick="closeCart()">×</button>
        </div>

        <div class="cart-items" id="cartItems"></div>

        <div class="cart-bottom">

            <div class="total-row">
                <span>Subtotal</span>
                <strong id="subtotal">0 XAF</strong>
            </div>

            <div class="total-row shipping">
                <span>Envío</span>
                <strong id="shipping">0 XAF</strong>
            </div>

            <div class="total-row final">
                <span>TOTAL</span>
                <strong id="total">0 XAF</strong>
            </div>

            <button class="checkout" onclick="openCheckout()">

            </button>

        </div>

    </aside>

</div>


<!-- CHECKOUT -->

<div class="checkout-form" id="checkoutForm">

    <div class="checkout-box">

        <h2>FINALIZAR PEDIDO</h2>

        <div class="field">
            <label>Nombre</label>
            <input id="customerName" type="text" placeholder="Tu nombre">
        </div>

        <div class="field">
            <label>Teléfono</label>
            <input id="customerPhone" type="tel" placeholder="Tu número">
        </div>

        <div class="field">
            <label>Dirección</label>
            <textarea id="customerAddress" placeholder="Dirección de entrega"></textarea>
        </div>

        <div class="field">
            <label>Método de envío</label>

            <select id="shippingMethod" onchange="updateCart()">
                <option value="0">Recogida / acordar</option>
                <option value="2000">Envío local — 2.000 XAF</option>
                <option value="5000">Envío — 5.000 XAF</option>
            </select>

        </div>

        <div class="field">
            <label>Notas</label>
            <textarea id="orderNotes" placeholder="Talla, color u otra información"></textarea>
        </div>

        <div class="form-buttons">

            <button class="cancel" onclick="closeCheckout()">
                CANCELAR
            </button>

            <button class="whatsapp" onclick="finishOrder()">
                PEDIR POR WHATSAPP
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   VIBELEVEL SUPABASE
========================================================= */

const SUPABASE_URL =
"https://yqlyxnlheoiftxhpteyb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5VLYWrFAgEXJkWhdErOikg_vHOKIHyb";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   CONFIGURACIÓN
========================================================= */

const WHATSAPP =
"240555626619";


let allProducts = [];
let cart = [];
let currentCategory = "ALL";


/* =========================================================
   CARGAR PRODUCTOS DESDE SUPABASE
========================================================= */

async function loadProducts(){

    const container =
        document.getElementById("products");

    container.innerHTML = `
        <div class="loading">
            CARGANDO PRODUCTOS...
        </div>
    `;

    try{

        const { data, error } = await db
            .from("products")
            .select("*")
            .order("created_at", {
                ascending:false
            });

        if(error){
            console.error(error);

            container.innerHTML = `
                <div class="error">
                    <strong>No se pudieron cargar los productos.</strong>
                    <br><br>
                    ${escapeHtml(error.message)}
                </div>
            `;

            return;
        }

        allProducts = data || [];

        buildCategories();

        renderProducts();

    }catch(error){

        console.error(error);

        container.innerHTML = `
            <div class="error">
                Error de conexión con Supabase.
                <br><br>
                ${escapeHtml(error.message)}
            </div>
        `;
    }
}


/* =========================================================
   CATEGORÍAS
========================================================= */

function buildCategories(){

    const box =
        document.getElementById("categories");

    const categories = [
        ...new Set(
            allProducts
                .map(p => p.category)
                .filter(Boolean)
        )
    ];

    box.innerHTML = `
        <button
            class="category ${currentCategory === "ALL" ? "active" : ""}"
            onclick="setCategory('ALL',this)"
        >
            TODOS
        </button>
    `;

    categories.forEach(category => {

        const button =
            document.createElement("button");

        button.className =
            "category " +
            (currentCategory === category
                ? "active"
                : "");

        button.textContent =
            String(category).toUpperCase();

        button.onclick =
            () => setCategory(category,button);

        box.appendChild(button);

    });
}


function setCategory(category,button){

    currentCategory = category;

    document
        .querySelectorAll(".category")
        .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    renderProducts();
}


/* =========================================================
   MOSTRAR PRODUCTOS
========================================================= */

function renderProducts(){

    const container =
        document.getElementById("products");

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();

    let products =
        allProducts.filter(product => {

            const name =
                String(product.name || "")
                    .toLowerCase();

            const description =
                String(product.description || "")
                    .toLowerCase();

            const category =
                String(product.category || "");

            const categoryOK =
                currentCategory === "ALL" ||
                category === currentCategory;

            const searchOK =
                !search ||
                name.includes(search) ||
                description.includes(search) ||
                category.toLowerCase().includes(search);

            return categoryOK && searchOK;
        });


    document.getElementById("productCount")
        .textContent =
        `${products.length} producto${products.length === 1 ? "" : "s"}`;


    if(!products.length){

        container.innerHTML = `
            <div class="empty">
                NO HAY PRODUCTOS PARA MOSTRAR.
            </div>
        `;

        return;
    }


    container.innerHTML =
        products.map(product => productCard(product)).join("");
}


/* =========================================================
   TARJETA DE PRODUCTO
========================================================= */

    const id =

    const name =
        escapeHtml(product.name || "Producto");

    const category =
        escapeHtml(product.category || "");

    const description =
        escapeHtml(product.description || "");

    const price =
        Number(product.price || 0);

    const oldPrice =
        Number(product.old_price || 0);

    const soldOut =
        product.sold_out === true ||
        Number(product.stock || 0) <= 0;


    const image =
        product.image_url ||
        "https://via.placeholder.com/700x900/111111/ffffff?text=VIBELEVEL";


    let sizes = [];

    if(Array.isArray(product.sizes)){
        sizes = product.sizes;
    }else if(typeof product.sizes === "string"){
        sizes =
            product.sizes
                .split(",")
                .map(x => x.trim())
                .filter(Boolean);
    }


    return `
        <article class="product">

            <div class="product-image">

                <img
                    src="${escapeAttribute(image)}"
                    alt="${escapeAttribute(name)}"
                    loading="lazy"
                    onerror="this.src='https://via.placeholder.com/700x900/111111/ffffff?text=VIBELEVEL'"
                >

                <div class="badges">

                    ${
                        product.is_new
                        ? `<span class="badge">NEW</span>`
                        : ""
                    }

                    ${
                        product.is_sale
                        ? `<span class="badge sale">SALE</span>`
                        : ""
                    }

                    ${
                        soldOut
                        ? `<span class="badge sold">SOLD OUT</span>`
                        : ""
                    }

                </div>

            </div>


            <div class="product-info">

                <div class="product-category">
                    ${category}
                </div>

                <div class="product-name">
                    ${name}
                </div>

                <div style="display:none">
                    ${description}
                </div>

                <div class="prices">

                    <span class="price">
                        ${formatPrice(price)}
                    </span>

                    ${
                        oldPrice > price
                        ? `
                        <span class="old-price">
                            ${formatPrice(oldPri
