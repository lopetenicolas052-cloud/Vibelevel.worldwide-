<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>VIBELEVEL WORLDWIDE</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#050505;color:#fff;font-family:Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}header{height:65px;background:#000;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:10}.logo{font-size:20px;font-weight:bold;letter-spacing:3px}.cartbtn{position:relative;background:#111;color:#fff;border:1px solid #333;border-radius:50%;width:42px;height:42px}.count{position:absolute;right:-4px;top:-4px;background:#fff;color:#000;border-radius:50%;font-size:10px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center}.hero{height:330px;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle,#1b1b1b,#000 70%);border-bottom:1px solid #222}.hero h1{font-size:clamp(40px,10vw,85px);letter-spacing:6px}.hero p{margin-top:15px;color:#888;letter-spacing:3px;font-size:11px}.controls,.collection{max-width:1300px;margin:auto;padding:20px 15px}.top{display:flex;gap:8px}.search{flex:1;background:#111;color:#fff;border:1px solid #333;padding:13px}.refresh{background:#fff;border:0;padding:0 16px}.cats{display:flex;gap:7px;overflow:auto;padding:13px 0}.cat{white-space:nowrap;background:#111;color:#aaa;border:1px solid #333;padding:8px 13px;border-radius:20px}.cat.active{background:#fff;color:#000}.title{display:flex;justify-content:space-between;margin-bottom:18px}.title h2{letter-spacing:2px}.title span{color:#777;font-size:11px}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}@media(max-width:900px){.products{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.products{grid-template-columns:repeat(2,1fr);gap:9px}}.product{background:#0d0d0d;border:1px solid #222;overflow:hidden}.pic{aspect-ratio:3/4;background:#151515;position:relative}.pic img{width:100%;height:100%;object-fit:cover}.badges{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px}.badge{background:#fff;color:#000;padding:4px 6px;font-size:8px;font-weight:bold}.sale{background:#000;color:#fff;border:1px solid #fff}.sold{background:#555;color:#fff}.info{padding:11px}.category{font-size:8px;color:#777;letter-spacing:1px;margin-bottom:5px}.name{font-size:14px;font-weight:bold;margin-bottom:6px}.desc{font-size:10px;color:#888;line-height:1.4;margin-bottom:7px}.prices{display:flex;gap:7px}.price{font-weight:bold}.old{text-decoration:line-through;color:#666;font-size:11px}.sizes{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}.size{font-size:8px;color:#aaa;border:1px solid #333;padding:4px}.add{width:100%;margin-top:10px;padding:9px;background:#fff;color:#000;border:0;font-size:10px;font-weight:bold}.add:disabled{background:#222;color:#666}.loading,.empty,.error{grid-column:1/-1;text-align:center;padding:60px 15px;color:#777}.error{background:#160909;color:#ff9999;text-align:left}.overlay{position:fixed;inset:0;background:#000b;z-index:20;display:none}.overlay.open{display:block}.cart{position:absolute;right:0;top:0;width:min(430px,100%);height:100%;background:#0b0b0b;display:flex;flex-direction:column;border-left:1px solid #333}.chead{height:65px;border-bottom:1px solid #222;padding:0 15px;display:flex;align-items:center;justify-content:space-between}.close{background:none;border:0;color:#fff;font-size:25px}.items{flex:1;overflow:auto;padding:15px}.item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #222}.item img{width:65px;height:78px;object-fit:cover}.iteminfo{flex:1}.itemname{font-weight:bold;font-size:13px}.itemprice{margin-top:6px}.qty{display:flex;align-items:center;gap:8px;margin-top:7px}.qty button{width:24px;height:24px;background:#171717;color:#fff;border:1px solid #333}.remove{background:none;border:0;color:#777;font-size:10px;margin-top:4px}.bottom{border-top:1px solid #222;padding:15px}.row{display:flex;justify-content:space-between;margin-bottom:7px}.final{font-size:19px;font-weight:bold;border-top:1px solid #333;padding-top:10px;margin-top:10px}.checkout{width:100%;margin-top:12px;padding:14px;background:#fff;color:#000;border:0;font-weight:bold}.checkout:disabled{background:#222;color:#666}.form{position:fixed;inset:0;background:#000d;z-index:30;display:none;align-items:center;justify-content:center;padding:15px}.form.open{display:flex}.box{width:min(500px,100%);max-height:90vh;overflow:auto;background:#0d0d0d;border:1px solid #333;padding:20px}.box h2{margin-bottom:18px;letter-spacing:2px}.field{margin-bottom:12px}.field label{display:block;color:#999;font-size:10px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;background:#111;color:#fff;border:1px solid #333;padding:11px}.field textarea{min-height:70px}.buttons{display:flex;gap:8px}.cancel,.wa{flex:1;padding:13px;border:0}.cancel{background:#111;color:#fff;border:1px solid #333}.wa{background:#fff;color:#000;font-weight:bold}footer{text-align:center;border-top:1px solid #222;padding:35px;color:#555;font-size:10px;letter-spacing:2px}</style></head><body>
<header><div class="logo">VIBELEVEL</div><button class="cartbtn" onclick="openCart()">🛒<span id="count" class="count">0</span></button></header>
<section class="hero"><div><h1>VIBELEVEL</h1><p>WORLDWIDE STREETWEAR</p></div></section>
<section class="controls"><div class="top"><input id="search" class="search" placeholder="Buscar producto..." oninput="render()"><button class="refresh" onclick="load()">↻</button></div><div id="cats" class="cats"></div></section>

<script>
const URL="https://yqlyxnlheoiftxhpteyb.supabase.co",KEY="sb_publishable_5VLYWrFAgEXJkWhdErOikg_vHOKIHyb",db=supabase.createClient(URL,KEY),WA="240555626619",FALL="https://via.placeholder.com/700x900/111111/ffffff?text=VIBELEVEL";let products=[],cart=[],current="ALL";
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function money(x){return Number(x||0).toLocaleString("es-ES")+" XAF"}
async function load(){let box=document.getElementById("products");box.innerHTML='<div class="loading">CARGANDO PRODUCTOS...</div>';let r=await db.from("products").select("*");if(r.error){box.innerHTML='<div class="error"><b>ERROR AL CARGAR PRODUCTOS</b><br><br>'+esc(r.error.message)+"</div>";return}products=r.data||[];if(products[0]?.created_at)products.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));categories();render()}
function categories(){let box=document.getElementById("cats"),a=[...new Set(products.map(x=>x.category).filter(Boolean))];box.innerHTML='<button class="cat '+(current=="ALL"?"active":"")+'" onclick="setcat(\'ALL\',this)">TODOS</button>';a.forEach(x=>{let b=document.createElement("button");b.className="cat "+(current==x?"active":"");b.textContent=String(x).toUpperCase();b.onclick=()=>setcat(x,b);box.appendChild(b)})}
function setcat(x,b){current=x;document.querySelectorAll(".cat").forEach(e=>e.classList.remove("active"));b.classList.add("active");render()}
function render(){let s=document.getElementById("search").value.toLowerCase().trim(),a=products.filter(p=>(current=="ALL"||p.category==current)&&(!s||String(p.name||"").toLowerCase().includes(s)||String(p.description||"").toLowerCase().includes(s)));document.getElementById("pc").textContent=a.length+" producto"+(a.length==1?"":"s");document.getElementById("products").innerHTML=a.length?a.map(card).join(""):'<div class="empty">NO HAY PRODUCTOS PARA MOSTRAR.</div>'}
function card(p){let stock=Number(p.stock??0),sold=p.sold_out===true||stock<=0,s=Array.isArray(p.sizes)?p.sizes:String(p.sizes||"").split(",").map(x=>x.trim()).filter(Boolean);return '<article class="product"><div class="pic"><img src="'+esc(p.image_url||FALL)+'" onerror="this.src=\''+FALL+'\'"><div class="badges">'+(p.is_new?'<span class="badge">NEW</span>':"")+(p.is_sale?'<span class="badge sale">SALE</span>':"")+(sold?'<span class="badge sold">SOLD OUT</span>':"")+'</div></div><div class="info"><div class="category">'+esc(p.category||"")+'</div><div class="name">'+esc(p.name||"Producto")+'</div>'+(p.description?'<div class="desc">'+esc(p.description)+'</div>':"")+'<div class="prices"><span class="price">'+money(p.price)+'</span>'+(Number(p.old_price)>Number(p.price)?'<span class="old">'+money(p.old_price)+'</span>':"")+'</div>'+(s.length?'<div class="sizes">'+s.map(x=>'<span class="size">'+esc(x)+'</span>').join("")+"</div>":"")+'<button class="add" onclick="add('+Number(p.id)+')" '+(sold?"disabled":"")+'>'+(sold?"AGOTADO":"AÑADIR AL CARRITO")+"</button></div></article>"}
function add(id){let p=products.find(x=>Number(x.id)==Number(id));if(!p)return;let stock=Number(p.stock??0);if(p.sold_out===true||stock<=0)return alert("Este producto está agotado.");let i=cart.find(x=>Number(x.id)==Number(id));if(i){if(i.qty>=stock)return alert("No hay más stock disponible.");i.qty++}else cart.push({id:p.id,name:p.name,price:Number(p.price||0),image_url:p.image_url,qty:1});update();openCart()}
function change(id,n){let i=cart.find(x=>Number(x.id)==Number(id));if(!i)return;let p=products.find(x=>Number(x.id)==Number(id));i.qty+=n;if(i.qty<=0)cart=cart.filter(x=>Number(x.id)!=Number(id));else if(p&&i.qty>Number(p.stock||0))i.qty=Number(p.stock||0);update()}
function removeItem(id){cart=cart.filter(x=>Number(x.id)!=Number(id));update()}
function update(){let box=document.getElementById("items"),num=cart.reduce((a,x)=>a+x.qty,0);document.getElementById("count").textContent=num;if(!cart.length)box.innerHTML='<div class="empty">TU CARRITO ESTÁ VACÍO.</div>';else box.innerHTML=cart.map(x=>'<div class="item"><img src="'+esc(x.image_url||FALL)+'"><div class="iteminfo"><div class="itemname">'+esc(x.name)+'</div><div class="itemprice">'+money(x.price*x.qty)+'</div><div class="qty"><button onclick="change('+x.id+',-1)">−</button><span>'+x.qty+'</span><button onclick="change('+x.id+',1)">+</button></div><button class="remove" onclick="removeItem('+x.id+')">ELIMINAR</button></div></div>').join("");let sub=cart.reduce((a,x)=>a+x.price*x.qty,0),ship=Number(document.getElementById("shipping")?.value||0);document.getElementById("sub").textContent=money(sub);document.getElementById("ship").textContent=money(ship);document.getElementById("total").textContent=money(sub+ship);document.getElementById("check").disabled=!cart.length}
function openCart(){document.getElementById("cartOverlay").classList.add("open");update()}function closeCart(){document.getElementById("cartOverlay").classList.remove("open")}function outside(e){if(e.target.id=="cartOverlay")closeCart()}function openForm(){if(cart.length)document.getElementById("form").classList.add("open")}function closeForm(){document.getElementById("form").classList.remove("open")}
function finish(){if(!cart.length)return;let name=document.getElementById("cname").value.trim(),phone=document.getElementById("cphone").value.trim(),address=document.getElementById("caddress").value.trim(),notes=document.getElementById("notes").value.trim(),ship=Number(document.getElementById("shipping").value||0);if(!name)return alert("Introduce tu nombre.");if(!phone)return alert("Introduce tu teléfono.");if(!address)return alert("Introduce la dirección.");let sub=cart.reduce((a,x)=>a+x.price*x.qty,0),total=sub+ship,lines=cart.map(x=>"• "+x.name+" x"+x.qty+" — "+money(x.price*x.qty));let msg="*VIBELEVEL WORLDWIDE — NUEVO PEDIDO*\\n\\n*CLIENTE*\\nNombre: "+name+"\\nTeléfono: "+phone+"\\nDirección: "+address+"\\n\\n*PRODUCTOS*\\n"+lines.join("\\n")+"\\n\\n*RESUMEN*\\nSubtotal: "+money(sub)+"\\nEnvío: "+money(ship)+"\\n*TOTAL: "+money(total)+"*"+(notes?"\\n\\nNotas: "+notes:"");window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(msg),"_blank")}
db.channel("products").on("postgres_changes",{event:"*",schema:"public",table:"products"},load).subscribe();load();update();
</script></body></html>
