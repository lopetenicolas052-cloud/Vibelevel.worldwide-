<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<title>VIBELEVEL WORLDWIDE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button,input,select,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:1000;
    height:70px;
    background:rgba(0,0,0,.96);
    border-bottom:1px solid #222;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
}

.logo{
    color:#fff;
    text-decoration:none;
    font-size:21px;
    font-weight:900;
    letter-spacing:3px;
}

.cart-button{
    position:relative;
    width:44px;
    height:44px;
    border-radius:50%;
    border:1px solid #333;
    background:#111;
    color:#fff;
    font-size:20px;
}

.cart-count{
    position:absolute;
    right:-4px;
    top:-4px;
    min-width:19px;
    height:19px;
    border-radius:50%;
    background:#fff;
    color:#000;
    font-size:10px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* HERO */

.hero{
    min-height:390px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:60px 20px;
    background:
        radial-gradient(circle at center,#191919 0%,#090909 42%,#000 78%);
    border-bottom:1px solid #1d1d1d;
}

.hero h1{
    font-size:clamp(42px,10vw,90px);
    font-weight:900;
    letter-spacing:7px;
    line-height:.95;
}

.hero p{
    margin-top:20px;
    color:#999;
    font-size:12px;
    letter-spacing:3px;
}

/* CONTROLES */

.controls{
    max-width:1300px;
    margin:auto;
    padding:25px 18px 15px;
}

.controls-top{
    display:flex;
    gap:10px;
}

.search{
    flex:1;
    background:#111;
    color:#fff;
    border:1px solid #333;
    padding:14px;
    outline:none;
}

.refresh{
    background:#fff;
    color:#000;
    border:0;
    padding:0 18px;
    font-weight:bold;
}

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:15px 0 5px;
}

.category{
    white-space:nowrap;
    background:#111;
    color:#aaa;
    border:1px solid #333;
    padding:9px 15px;
    border-radius:30px;
}

.category.active{
    background:#fff;
    color:#000;
}

/* COLLECTION */

.collection{
    max-width:1300px;
    margin:auto;
    padding:10px 18px 80px;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:end;
    margin-bottom:20px;
}

.section-title h2{
    font-size:24px;
    letter-spacing:2px;
}

.section-title span{
    color:#777;
    font-size:12px;
}

.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
}

@media(max-width:950px){
    .products{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:650px){
    .products{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }
}

/* PRODUCT */

.product{
    background:#0d0d0d;
    border:1px solid #1d1d1d;
    overflow:hidden;
}

.product-image{
    aspect-ratio:3/4;
    background:#151515;
    position:relative;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.badges{
    position:absolute;
    top:10px;
    left:10px;
    display:flex;
    flex-direction:column;
    gap:5px;
}

.badge{
    background:#fff;
    color:#000;
    padding:5px 7px;
    font-size:9px;
    font-weight:bold;
    letter-spacing:1px;
}

.badge.sale{
    background:#000;
    color:#fff;
    border:1px solid #fff;
}

.badge.sold{
    background:#666;
    color:#fff;
}

.product-info{
    padding:13px;
}

.product-category{
    color:#777;
    font-size:9px;
    letter-spacing:1.5px;
    margin-bottom:6px;
}

.product-name{
    font-size:15px;
    font-weight:bold;
    margin-bottom:8px;
}

.description{
    color:#888;
    font-size:11px;
    line-height:1.4;
    margin-bottom:8px;
}

.prices{
    display:flex;
    gap:8px;
    align-items:center;
}

.price{
    font-weight:bold;
}

.old-price{
    color:#666;
    text-decoration:line-through;
    font-size:12px;
}

.sizes{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
    margin-top:10px;
}

.size{
    border:1px solid #333;
    color:#aaa;
    padding:4px 6px;
    font-size:9px;
}

.add{
    width:100%;
    margin-top:12px;
    padding:10px;
    background:#fff;
    color:#000;
    border:1px solid #fff;
    font-size:11px;
    font-weight:bold;
}

.add:disabled{
    background:#222;
    color:#666;
    border-color:#222;
}

/* ESTADOS */

.loading,
.empty{
    grid-column:1/-1;
    text-align:center;
    padding:80px 20px;
    color:#777;
}

.error{
    grid-column:1/-1;
    padding:25px;
    background:#160909;
    border:1px solid #662222;
    color:#ff9999;
    line-height:1.6;
}

/* CART */

.cart-overlay{
    position:fixed;
    inset:0;
    z-index:2000;
    background:rgba(0,0,0,.75);
    display:none;
}

.cart-overlay.open{
    display:block;
}

.cart{
    position:absolute;
    right:0;
    top:0;
    width:min(430px,100%);
    height:100%;
    background:#0b0b0b;
    border-left:1px solid #333;
    display:flex;
    flex-direction:column;
}

.cart-header{
    height:70px;
    padding:0 18px;
    border-bottom:1px solid #222;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.cart-header h3{
    letter-spacing:2px;
}

.close{
    background:none;
    border:0;
    color:#fff;
    font-size:26px;
}

.cart-items{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.cart-item{
    display:flex;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid #222;
}

.cart-item img{
    width:70px;
    height:85px;
    object-fit:cover;
}

.cart-item-info{
    flex:1;
}

.cart-item-name{
    font-weight:bold;
    font-size:14px;
}

.cart-item-size{
    color:#777;
    font-size:11px;
    margin-top:5px;
}

.cart-item-price{
    margin-top:8px;
}

.qty{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
}

.qty button{
    width:25px;
    height:25px;
    background:#171717;
    color:#fff;
    border:1px solid #333;
}

.remove{
    background:none;
    border:0;
    color:#777;
    font-size:11px;
    margin-top:5px;
}

.cart-bottom{
    border-top:1px solid #222;
    padding:18px;
}

.total-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
}

.total-row.shipping{
    color:#999;
}

.total-row.final{
    font-size:20px;
    font-weight:bold;
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid #333;
}

.checkout{
    width:100%;
    margin-top:15px;
    padding:15px;
    background:#fff;
    color:#000;
    border:0;
    font-weight:bold;
}

/* CHECKOUT */

.checkout-form{
    position:fixed;
    inset:0;
    z-index:3000;
    background:rgba(0,0,0,.85);
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.checkout-form.open{
    display:flex;
}

.checkout-box{
    width:min(500px,100%);
    max-height:90vh;
    overflow-y:auto;
    background:#0d0d0d;
    border:1px solid #333;
    padding:22px;
}

.checkout-box h2{
    margin-bottom:20px;
    letter-spacing:2px;
}

.field{
    margin-bottom:13px;
}

.field label{
    display:block;
    color:#999;
    font-size:11px;
    margin-bottom:6px;
}

.field input,
.field textarea,
.field select{
    width:100%;
    background:#111;
    color:#fff;
    border:1px solid #333;
    padding:12px;
    outline:none;
}

.field textarea{
    min-height:80px;
    resize:vertical;
}

.form-buttons{
    display:flex;
    gap:10px;
}

.cancel{
    flex:1;
    padding:13px;
    background:#111;
    color:#fff;
    border:1px solid #333;
}

.whatsapp{
    flex:2;
    padding:13px;
    background:#fff;
    color:#000;
    border:0;
    font-weight:bold;
}

/* FOOTER */

footer{
    border-top:1px solid #222;
    text-align:center;
    padding:40px 20px;
    color:#555;
    font-size:11px;
    letter-spacing:2px;
}
</style>
</head>

<body>

<header>

    <a href="#" class="logo">VIBELEVEL</a>

    <button class="cart-button" onclick="openCart()">
        🛒
        <span id="cartCount" class="cart-count">0</span>
    </button>

</header>


<section class="hero">

    <div>
        <h1>VIBELEVEL</h1>
        <p>WORLDWIDE STREETWEAR</p>
    </div>

</section>


<section class="controls">

    <div class="controls-top">

        <input
            id="search"
            class="search"
            type="text"
            placeholder="Buscar producto..."
            oninput="renderProducts()"
        >

        <button
            class="refresh"
            onclick="loadProducts()"
        >
            ↻
        </button>

    </div>

    <div
        id="categories"
        class="categories"
    ></div>

</section>


<main class="collection">

    <div class="section-title">

        <h2>COLECCIÓN</h2>

        <span id="productCount">
            0 productos
        </span>

    </div>

    <div
        id="products"
        class="products"
    >
        <div class="loading">
            CARGANDO PRODUCTOS...
        </div>
    </div>

</main>


<footer>
    VIBELEVEL WORLDWIDE · STREETWEAR
</footer>


<!-- CARRITO -->

<div
    id="cartOverlay"
    class="cart-overlay"
    onclick="closeCartOutside(event)"
>

    <aside class="cart">

        <div class="cart-header">

            <h3>MI CARRITO</h3>

            <button
                class="close"
                onclick="closeCart()"
            >
                ×
            </button>

        </div>

        <div
            id="cartItems"
            class="cart-items"
        ></div>

        <div class="cart-bottom">

            <div class="total-row">
                <span>Subtotal</span>
                <strong id="subtotal">0 XAF</strong>
            </div>

            <div class="total-row shipping">
                <span>Envío</span>
                <strong id="shipping">0 XAF</strong>
            </div>

            <div class="total-row final">
                <span>TOTAL</span>
                <strong id="total">0 XAF</strong>
            </div>

            <button
                class="checkout"
                onclick="openCheckout()"
            >
                FINALIZAR COMPRA
            </button>

        </div>

    </aside>

</div>


<!-- CHECKOUT -->

<div
    id="checkoutForm"
    class="checkout-form"
>

    <div class="checkout-box">

        <h2>FINALIZAR PEDIDO</h2>

        <div class="field">
            <label>Nombre</label>
            <input
                id="customerName"
                type="text"
                placeholder="Tu nombre"
            >
        </div>

        <div class="field">
            <label>Teléfono</label>
            <input
                id="customerPhone"
                type="tel"
                placeholder="Tu número"
            >
        </div>

        <div class="field">
            <label>Dirección</label>
            <textarea
                id="customerAddress"
                placeholder="Dirección de entrega"
            ></textarea>
        </div>

        <div class="field">
            <label>Método de envío</label>

            <select
                id="shippingMethod"
                onchange="updateCart()"
            >
                <option value="0">
                    Recogida / acordar
                </option>

                <option value="2000">
                    Envío local — 2.000 XAF
                </option>

                <option value="5000">
                    Envío — 5.000 XAF
                </option>
            </select>

        </div>

        <div class="field">
            <label>Notas</label>

            <textarea
                id="orderNotes"
                placeholder="Talla, color u otra información"
            ></textarea>

        </div>

        <div class="form-buttons">

            <button
                class="cancel"
                onclick="closeCheckout()"
            >
                CANCELAR
            </button>

            <button
                class="whatsapp"
                onclick="finishOrder()"
            >
                PEDIR POR WHATSAPP
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://yqlyxnlheoiftxhpteyb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5VLYWrFAgEXJkWhdErOikg_vHOKIHyb";

const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   CONFIGURACIÓN
========================================================= */

const WHATSAPP =
"240555626619";

let allProducts = [];
let cart = [];
let currentCategory = "ALL";


/* =========================================================
   CARGAR PRODUCTOS
========================================================= */

async function loadProducts(){

    const container =
        document.getElementById("products");

    container.innerHTML = `
        <div class="loading">
            CARGANDO PRODUCTOS...
        </div>
    `;

    try{

        const result =
            await db
            .from("products")
            .select(
                "id,name,description,category,price,old_price,image_url,sizes,stock,sold_out,is_new,is_sale,created_at"
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(result.error){

            console.error(
                "SUPABASE ERROR:",
                result.error
            );

            container.innerHTML = `
                <div class="error">
                    <strong>ERROR AL CARGAR PRODUCTOS</strong>
                    <br><br>
                    ${escapeHtml(result.error.message)}
                    <br><br>
                    Código:
                    ${escapeHtml(result.error.code || "")}
                </div>
            `;

            return;
        }


        allProducts =
            result.data || [];

        buildCategories();

        renderProducts();


    }catch(error){

        console.error(error);

        container.innerHTML = `
            <div class="error">
                <strong>ERROR DE CONEXIÓN</strong>
                <br><br>
                ${escapeHtml(error.message)}
            </div>
        `;

    }

}


/* =========================================================
   CATEGORÍAS
========================================================= */

function buildCategories(){

    const box =
        document.getElementById("categories");

    const categories = [
        ...new Set(
            allProducts
            .map(product => product.category)
            .filter(Boolean)
        )
    ];

    box.innerHTML = `
        <button
            class="category ${currentCategory === "ALL" ? "active" : ""}"
            onclick="setCategory('ALL',this)"
        >
            TODOS
        </button>
    `;

    categories.forEach(category => {

        const button =
            document.createElement("button");

        button.className =
            "category " +
            (
                currentCategory === category
                ? "active"
                : ""
            );

        button.textContent =
            String(category).toUpperCase();

        button.onclick =
            () => setCategory(
                category,
                button
            );

        box.appendChild(button);

    });

}


function setCategory(category,button){

    currentCategory =
        category;

    document
        .querySelectorAll(".category")
        .forEach(button =>
            button.classList.remove("active")
        );

    button.classList.add("active");

    renderProducts();

}


/* =========================================================
   MOSTRAR PRODUCTOS
========================================================= */

function renderProducts(){

    const container =
        document.getElementById("products");

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    const products =
        allProducts.filter(product => {

            const name =
                String(product.name || "")
                .toLowerCase();

            const description =
                String(product.description || "")
                .toLowerCase();

            const category =
                String(product.category || "")
                .toLowerCase();


            const categoryOK =
                currentCategory === "ALL" ||
                String(product.category || "") ===
                currentCategory;


            const searchOK =
                !search ||
                name.includes(search) ||
                description.includes(search) ||
                category.includes(search);


            return categoryOK && searchOK;

        });


    document
        .getElementById("productCount")
        .textContent =
        `${products.length} producto${products.length === 1 ? "" : "s"}`;


    if(!products.length){

        container.innerHTML = `
            <div class="empty">
                NO HAY PRODUCTOS PARA MOSTRAR.
            </div>
        `;

        return;
    }


    container.innerHTML =
        products
        .map(product => productCard(product))
        .join("");

}


/* =========================================================
   TARJETA
========================================================= */

function productCard(product){

    const price =
        Number(product.price || 0);

    const oldPrice =
        Number(product.old_price || 0);

    const stock =
        Number(product.stock || 0);

    const soldOut =
        product.sold_out === true ||
        stock <= 0;


    let sizes = [];

    if(Array.isArray(product.sizes)){

        sizes =
            product.sizes;

    }else if(typeof product.sizes === "string"){

        sizes =
            product.sizes
            .split(",")
            .map(size => size.trim())
            .filter(Boolean);

    }


    const image =
        product.image_url ||
        "https://via.placeholder.com/700x900/111111/ffffff?text=VIBELEVEL";


    return `

        <article class="product">

            <div class="product-image">

                <img
                    src="${escapeAttribute(image)}"
                    alt="${escapeAttribute(product.name || "VibeLevel")}"
                    loading="lazy"
                    onerror="this.onerror=null;this.src='https://via.placeholder.com/700x900/111111/ffffff?text=VIBELEVEL'"
                >

                <div class="badges">

                    ${
                        product.is_new
                        ? `<span class="badge">NEW</span>`
                        : ""
                    }

                    ${
                        product.is_sale
                        ? `<span class="badge sale">SALE</span>`
                        : ""
                    }

                    ${
                        soldOut
                        ? `<span class="badge sold">SOLD OUT</span>`
                        : ""
                    }

                </div>

            </div>


            <div class="product-info">

                <div class="product-category">
                    ${escapeHtml(product.category || "")}
                </div>

                <div class="product-name">
                    ${escapeHtml(product.name || "Producto")}
    </div>
