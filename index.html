<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#000">
<title>VibeLevel Worldwide</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:#000;font-family:Arial,sans-serif}
header{background:#000;color:#fff;padding:18px 5%;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-weight:900;letter-spacing:3px;font-size:22px}
nav a{color:#fff;text-decoration:none;margin-left:20px;font-size:13px}
.hero{background:#000;color:#fff;padding:80px 5%;min-height:420px;display:flex;align-items:center}
.hero h1{font-size:clamp(45px,9vw,100px);line-height:.85;margin:0;font-weight:900}
.hero p{letter-spacing:4px;margin-top:25px}
section{padding:55px 5%}
.section-title{font-size:30px;margin-bottom:25px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px}
input,select,textarea,button{font:inherit}
input,select,textarea{padding:13px;border:1px solid #ccc;border-radius:4px;width:100%}
.controls input{max-width:400px}
.controls select{max-width:220px}
button{border:0;background:#000;color:#fff;padding:13px 18px;cursor:pointer;border-radius:4px}
button:disabled{opacity:.45;cursor:not-allowed}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}
.product{border:1px solid #ddd;background:#fff;position:relative}
.product img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.product-info{padding:14px}
.product-name{font-weight:700}
.price{font-weight:700;margin-top:8px}
.badge{position:absolute;top:10px;left:10px;background:#000;color:#fff;padding:6px 9px;font-size:11px}
.fav{position:absolute;right:10px;top:10px;background:#fff;color:#000;border-radius:50%;width:34px;height:34px;padding:0}
footer{background:#000;color:#fff;padding:40px 5%;margin-top:30px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;overflow:auto;padding:20px}
.modal-content{background:#fff;max-width:650px;margin:30px auto;padding:25px;position:relative}
.close{position:absolute;right:15px;top:10px;background:none;color:#000;font-size:25px;padding:5px}
.detail-img{width:100%;max-height:500px;object-fit:contain}
.sizes{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
.size-btn{background:#fff;color:#000;border:1px solid #000}
.size-btn.active{background:#000;color:#fff}
.cart-item{display:flex;gap:12px;border-bottom:1px solid #ddd;padding:12px 0;align-items:center}
.cart-item img{width:70px;height:70px;object-fit:cover}
.qty{display:flex;align-items:center;gap:8px}
.qty button{padding:5px 10px}
.total{font-size:20px;font-weight:700;margin:20px 0}
.form-group{margin-bottom:15px}
.form-group label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.payment-box{border:1px solid #ddd;padding:15px;margin:15px 0;background:#fafafa}
.review{border-bottom:1px solid #ddd;padding:15px 0}
.stars{letter-spacing:2px}
@media(max-width:600px){
header{padding:15px}
nav a{margin-left:10px;font-size:11px}
.hero{padding:60px 5%}
.products{grid-template-columns:repeat(2,1fr);gap:10px}
.product-info{padding:10px}
}
</style>
</head>
<body>

<header>
<div class="logo">VIBELEVEL</div>
<nav>
<a href="#collection">COLLECTION</a>
<a href="#reviews">REVIEWS</a>
<button onclick="openCart()">CART (<span id="cartCount">0</span>)</button>
</nav>
</header>

<div class="hero">
<div>
<h1>VIBELEVEL</h1>
<p>WORLDWIDE STREETWEAR</p>
</div>
</div>

<section id="collection">
<h2 class="section-title">COLLECTION</h2>
<div class="controls">
<input id="search" placeholder="Buscar producto...">
<select id="category">
<option value="">Todas las categorías</option>
<option value="NEW">NEW</option>
<option value="SALE">SALE</option>
</select>
</div>
<div id="products" class="products"></div>
</section>

<section id="reviews">
<h2 class="section-title">REVIEWS</h2>
<div id="reviewsList"></div>
<div style="margin-top:25px">
<h3>Deja tu reseña</h3>
<input id="reviewName" placeholder="Tu nombre">
<textarea id="reviewText" placeholder="Tu opinión..." style="margin-top:10px"></textarea>
<div class="sizes" id="ratingButtons">
<button class="size-btn" onclick="setRating(1)">★</button>
<button class="size-btn" onclick="setRating(2)">★★</button>
<button class="size-btn" onclick="setRating(3)">★★★</button>
<button class="size-btn" onclick="setRating(4)">★★★★</button>
<button class="size-btn" onclick="setRating(5)">★★★★★</button>
</div>
<button onclick="addReview()">Publicar reseña</button>
</div>
</section>

<footer>
<div class="logo">VIBELEVEL WORLDWIDE</div>
<p>Streetwear without limits.</p>
</footer>

<div id="detailModal" class="modal">
<div class="modal-content">
<button class="close" onclick="closeModal('detailModal')">×</button>
<div id="detailContent"></div>
</div>
</div>

<div id="cartModal" class="modal">
<div class="modal-content">
<button class="close" onclick="closeModal('cartModal')">×</button>
<h2>Tu carrito</h2>
<div id="cartItems"></div>
<div id="cartSummary"></div>

<div class="form-group">
<label>Envío</label>
<label><input type="radio" name="shipping" value="0" checked onchange="updateCart()"> Local — 0 XAF</label>
<label><input type="radio" name="shipping" value="50000" onchange="updateCart()"> Estándar — 50.000 XAF</label>
<label><input type="radio" name="shipping" value="70000" onchange="updateCart()"> Express — 70.000 XAF</label>
</div>

<div class="form-group">
<label>Nombre completo</label>
<input id="customerName" placeholder="Nombre">
</div>
<div class="form-group">
<label>Teléfono</label>
<input id="customerPhone" placeholder="Número de teléfono">
</div>
<div class="form-group">
<label>Dirección</label>
<textarea id="customerAddress" placeholder="Dirección de entrega"></textarea>
</div>

<button onclick="checkoutWhatsApp()">Pedir por WhatsApp</button>
<button onclick="openPaymentCheckout()" style="margin-top:10px">Continuar al pago</button>

<div id="paymentCheckout" style="display:none;margin-top:25px">
<h2>Pago</h2>

<div class="form-group">
<label>Nombre completo</label>
<input id="checkoutName">
</div>
<div class="form-group">
<label>Teléfono</label>
<input id="checkoutPhone">
</div>
<div class="form-group">
<label>Dirección</label>
<textarea id="checkoutAddress"></textarea>
</div>

<div class="form-group">
<label>Método de pago</label>
<select id="paymentMethod" onchange="showPaymentInfo()">
<option value="">Selecciona un método</option>
<option value="BANGE">BANGE</option>
<option value="MUNI DINERO">MUNI DINERO</option>
</select>
</div>

<div id="paymentInfo" class="payment-box"></div>

<div class="form-group">
<label>Referencia del pago</label>
<input id="paymentReference" placeholder="Referencia / número de operación">
</div>

<div class="form-group">
<label>Comprobante de pago</label>
<input id="paymentProof" type="file" accept="image/*">
</div>

<button onclick="submitOrder()">Confirmar pedido</button>
<div id="orderMessage" style="margin-top:15px"></div>
</div>
</div>
</div>

<script>
const SUPABASE_URL="https://yqlyxnlheoiftxhpteyb.supabase.co";
const SUPABASE_KEY="sb_publishable_5VLYWrFAgEXJkWhdErOikg_vHOKIHyb";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const WHATSAPP="240555626619";

let products=[];
let cart=JSON.parse(localStorage.getItem("vibelevel_cart")||"[]");
let favorites=JSON.parse(localStorage.getItem("vibelevel_favorites")||"[]");
let selectedProduct=null;
let selectedSize="";
let selectedRating=0;

function money(n){
return Number(n||0).toLocaleString("es-ES")+" XAF";
}

function escapeHtml(s){
return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function saveCart(){
localStorage.setItem("vibelevel_cart",JSON.stringify(cart));
updateCartCount();
}

function updateCartCount(){
document.getElementById("cartCount").textContent=cart.reduce((a,b)=>a+b.quantity,0);
}

async function loadProducts(){
const {data,error}=await db.from("products").select("*").order("created_at",{ascending:false});
if(error){
console.error(error);
document.getElementById("products").innerHTML="<p>No se pudieron cargar los productos.</p>";
return;
}
products=data||[];
const validIds=products.map(p=>String(p.id));
cart=cart.filter(i=>validIds.includes(String(i.id)));
saveCart();
renderProducts();
}

function renderProducts(){
const q=document.getElementById("search").value.toLowerCase().trim();
const cat=document.getElementById("category").value;
let list=products.filter(p=>{
const text=(p.name+" "+(p.description||"")+" "+(p.category||"")).toLowerCase();
const searchOk=!q||text.includes(q);
const catOk=!cat||(cat==="NEW"?p.is_new:cat==="SALE"?p.is_sale:true);
return searchOk&&catOk;
});
const box=document.getElementById("products");
if(!list.length){
box.innerHTML="<p>No hay productos.</p>";
return;
}
box.innerHTML=list.map(p=>{
const fav=favorites.includes(String(p.id));
const sold=!!p.sold_out||Number(p.stock||0)<=0;
return `<div class="product">
${p.is_new?'<div class="badge">NEW</div>':p.is_sale?'<div class="badge">SALE</div>':''}
<button class="fav" onclick="toggleFavorite('${p.id}')">${fav?"♥":"♡"}</button>
<img src="${escapeHtml(p.image_url||"")}" alt="${escapeHtml(p.name)}" onclick="openProduct('${p.id}')">
<div class="product-info">
<div class="product-name">${escapeHtml(p.name)}</div>
<div class="price">${money(p.price)}</div>
<button onclick="openProduct('${p.id}')" style="margin-top:10px" ${sold?"disabled":""}>${sold?"Agotado":"Ver producto"}</button>
</div>
</div>`;
}).join("");
}

function toggleFavorite(id){
id=String(id);
favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];
localStorage.setItem("vibelevel_favorites",JSON.stringify(favorites));
renderProducts();
}

function openProduct(id){
selectedProduct=products.find(p=>String(p.id)===String(id));
if(!selectedProduct)return;
selectedSize="";
const p=selectedProduct;
const sizes=Array.isArray(p.sizes)?p.sizes:(p.sizes||"").split(",").map(x=>x.trim()).filter(Boolean);
document.getElementById("detailContent").innerHTML=`
<img class="detail-img" src="${escapeHtml(p.image_url||"")}" alt="${escapeHtml(p.name)}">
<h2>${escapeHtml(p.name)}</h2>
<p>${escapeHtml(p.description||"")}</p>
<div class="price">${money(p.price)}</div>
<p>Stock: ${Number(p.stock||0)}</p>
<div class="sizes">${sizes.map(s=>`<button class="size-btn" onclick="selectSize('${escapeHtml(s)}',this)">${escapeHtml(s)}</button>`).join("")}</div>
<button onclick="addSelectedToCart()" ${p.sold_out||Number(p.stock||0)<=0?"disabled":""}>Añadir al carrito</button>`;
document.getElementById("detailModal").style.display="block";
}

function selectSize(size,btn){
selectedSize=size;
document.querySelectorAll("#detailContent .size-btn").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
}

function addSelectedToCart(){
if(!selectedProduct)return;
addToCart(selectedProduct,selectedSize);
}

function addToCart(p,size){
if(p.sold_out||Number(p.stock||0)<=0){
alert("Producto agotado.");
return;
}
const sizes=Array.isArray(p.sizes)?p.sizes:(p.sizes||"").split(",").map(x=>x.trim()).filter(Boolean);
if(!size)size=sizes[0]||"Única";
const key=String(p.id)+"_"+size;
const item=cart.find(x=>x.key===key);
if(item){
if(item.quantity>=Number(p.stock||0)){
alert("No hay más stock disponible.");
return;
}
item.quantity++;
}else{
cart.push({
key,
id:p.id,
name:p.name,
price:Number(p.price||0),
image_url:p.image_url||"",
size,
quantity:1,
stock:Number(p.stock||0)
});
}
saveCart();
closeModal("detailModal");
openCart();
}

function changeQty(key,delta){
const item=cart.find(x=>x.key===key);
if(!item)return;
item.quantity+=delta;
if(item.quantity<=0)cart=cart.filter(x=>x.key!==key);
else if(item.quantity>item.stock)item.quantity=item.stock;
saveCart();
updateCart();
}

function removeItem(key){
cart=cart.filter(x=>x.key!==key);
saveCart();
updateCart();
}

function updateCart(){
const box=document.getElementById("cartItems");
if(!cart.length){
box.innerHTML="<p>Tu carrito está vacío.</p>";
document.getElementById("cartSummary").innerHTML="";
return;
}
let subtotal=0;
box.innerHTML=cart.map(i=>{
const line=i.price*i.quantity;
subtotal+=line;
return `<div class="cart-item">
<img src="${escapeHtml(i.image_url)}">
<div style="flex:1">
<strong>${escapeHtml(i.name)}</strong>
<div>Talla: ${escapeHtml(i.size)}</div>
<div>${money(i.price)}</div>
<div class="qty">
<button onclick="changeQty('${i.key}',-1)">−</button>
<span>${i.quantity}</span>
<button onclick="changeQty('${i.key}',1)">+</button>
<button onclick="removeItem('${i.key}')">×</button>
</div>
</div>
<div>${money(line)}</div>
</div>`;
}).join("");
const shipping=Number(document.querySelector('input[name="shipping"]:checked')?.value||0);
document.getElementById("cartSummary").innerHTML=`
<div>Subtotal: ${money(subtotal)}</div>
<div>Envío: ${money(shipping)}</div>
<div class="total">Total: ${money(subtotal+shipping)}</div>`;
}

function openCart(){
document.getElementById("cartModal").style.display="block";
document.getElementById("paymentCheckout").style.display="none";
updateCart();
}

function closeModal(id){
document.getElementById(id).style.display="none";
}

function openPaymentCheckout(){
if(!cart.length){
alert("El carrito está vacío.");
return;
}
const checkout=document.getElementById("paymentCheckout");
checkout.style.display="block";
checkout.scrollIntoView({behavior:"smooth",block:"start"});
}

function checkoutWhatsApp(){
if(!cart.length){
alert("El carrito está vacío.");
return;
}
const name=document.getElementById("customerName").value.trim();
const phone=document.getElementById("customerPhone").value.trim();
const address=document.getElementById("customerAddress").value.trim();
const shipping=Number(document.querySelector('input[name="shipping"]:checked')?.value||0);
let subtotal=0;
let lines=cart.map(i=>{
const line=i.price*i.quantity;
subtotal+=line;
return `• ${i.name} | Talla: ${i.size} | Cantidad: ${i.quantity} | ${money(line)}`;
}).join("\n");
const total=subtotal+shipping;
const msg=`VIBELEVEL WORLDWIDE
PEDIDO

Cliente: ${name||"No indicado"}
Teléfono: ${phone||"No indicado"}
Dirección: ${address||"No indicada"}

${lines}

Subtotal: ${money(subtotal)}
Envío: ${money(shipping)}
TOTAL: ${money(total)}`;
window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(msg),"_blank");
}

function showPaymentInfo(){
const method=document.getElementById("paymentMethod").value;
const box=document.getElementById("paymentInfo");
if(method==="BANGE"){
box.innerHTML="<strong>BANGE</strong><br>Número de cuenta: 38816123501-21<br>Titular: Nicolás Salvador Lopete Sima";
}else if(method==="MUNI DINERO"){
box.innerHTML="<strong>MUNI DINERO</strong><br>Teléfono: +240 555626619<br>Titular: Nicolás Salvador Lopete Sima";
}else box.innerHTML="";
}

function buildOrderItems(){
let subtotal=0;
const orderItems=cart.map(i=>{
const line=i.price*i.quantity;
subtotal+=line;
return{
product_id:i.id,
product_name:i.name,
quantity:i.quantity,
size:i.size,
unit_price:i.price,
line_total:line
};
});
return{orderItems,subtotal};
}

function buildAdminWhatsAppUrl(orderNumber,name,phone,address,paymentMethod,paymentReference,orderItems,subtotal,shipping,total){
const quantityTotal=orderItems.reduce((a,i)=>a+Number(i.quantity||0),0);
const lines=orderItems.map(i=>`• ${i.product_name} | Talla: ${i.size} | Cantidad: ${i.quantity} | ${money(i.line_total)}`).join("\n");
const msg=`VIBELEVEL WORLDWIDE
NUEVO PEDIDO

Pedido: ${orderNumber}
Cliente: ${name}
Teléfono: ${phone}
Dirección: ${address}

Método de pago: ${paymentMethod}
Referencia: ${paymentReference}

PRODUCTOS:
${lines}

Cantidad total de productos: ${quantityTotal}
Subtotal: ${money(subtotal)}
Envío: ${money(shipping)}
TOTAL: ${money(total)}

Estado del pedido: EN PROCESO
Pago: PENDIENTE DE VERIFICACIÓN`;
return "https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(msg);
}
     async function submitOrder(){
const message=document.getElementById("orderMessage");
message.innerHTML="";

if(!cart.length){
alert("El carrito está vacío.");
return;
}

const name=document.getElementById("checkoutName").value.trim();
const phone=document.getElementById("checkoutPhone").value.trim();
const address=document.getElementById("checkoutAddress").value.trim();
const paymentMethod=document.getElementById("paymentMethod").value;
const paymentReference=document.getElementById("paymentReference").value.trim();
const proof=document.getElementById("paymentProof").files[0];

if(!name||!phone||!address||!paymentMethod||!paymentReference||!proof){
message.innerHTML="<p>Completa todos los campos y sube el comprobante.</p>";
return;
}

if(!proof.type.startsWith("image/")){
message.innerHTML="<p>El comprobante debe ser una imagen.</p>";
return;
}

if(proof.size>8*1024*1024){
message.innerHTML="<p>El comprobante no puede superar 8 MB.</p>";
return;
}

let whatsappWindow=null;

try{
whatsappWindow=window.open("about:blank","_blank");

const {orderItems,subtotal}=buildOrderItems();

const shipping=Number(
document.querySelector('input[name="shipping"]:checked')?.value||0
);

const total=subtotal+shipping;
const orderNumber="VL-"+Date.now();

const extension=(proof.name.split(".").pop()||"jpg").toLowerCase();
const filePath=
"comprobantes/"+orderNumber+"-"+Math.random().toString(36).slice(2)+"."+extension;

const {error:uploadError}=await db
.storage
.from("payment-proofs")
.upload(filePath,proof,{
contentType:proof.type,
upsert:false
});

if(uploadError){
throw new Error(
"Error al subir comprobante: "+
uploadError.message
);
}

const {data:orderData,error:orderError}=await db
.from("orders")
.insert({
order_number:orderNumber,
customer_name:name,
customer_phone:phone,
customer_address:address,
payment_method:paymentMethod,
payment_reference:paymentReference,
payment_proof_url:filePath,
shipping_method:shipping===0?"LOCAL":"DELIVERY",
shipping_cost:shipping,
subtotal:subtotal,
total:total,
payment_status:"PENDING",
order_status:"NEW"
})
.select()
.single();

if(orderError){
throw new Error(
"Error al crear pedido: "+
orderError.message+
" | Código: "+
(orderError.code||"sin código")
);
}

const itemsToInsert=orderItems.map(i=>({
order_id:orderData.id,
product_id:i.product_id,
product_name:i.product_name,
quantity:i.quantity,
size:i.size,
unit_price:i.unit_price,
line_total:i.line_total
}));

const {
data:itemsData,
error:itemsError
}=await db
.from("order_items")
.insert(itemsToInsert)
.select();

console.log("ITEMS:",itemsToInsert);
console.log("RESPUESTA:",itemsData);
console.log("ERROR:",itemsError);

if(itemsError){
throw new Error(
"Error al guardar productos: "+
itemsError.message+
" | Código: "+
(itemsError.code||"sin código")
);
}

message.innerHTML=`
<div style="padding:15px;border:1px solid #000">
<strong>Pedido recibido correctamente.</strong><br><br>
Número de pedido: <strong>${escapeHtml(orderNumber)}</strong><br>
Estado: <strong>EN PROCESO</strong><br>
Pago: <strong>PENDIENTE DE VERIFICACIÓN</strong>
</div>`;

const whatsappUrl=buildAdminWhatsAppUrl(
orderNumber,
name,
phone,
address,
paymentMethod,
paymentReference,
orderItems,
subtotal,
shipping,
total
);

if(whatsappWindow){
whatsappWindow.location.href=whatsappUrl;
}else{
window.open(whatsappUrl,"_blank");
}

cart=[];
saveCart();

document.getElementById("checkoutName").value="";
document.getElementById("checkoutPhone").value="";
document.getElementById("checkoutAddress").value="";
document.getElementById("paymentMethod").value="";
document.getElementById("paymentReference").value="";
document.getElementById("paymentProof").value="";
document.getElementById("paymentInfo").innerHTML="";

}catch(error){
console.error(error);

if(whatsappWindow)whatsappWindow.close();

message.innerHTML=`
<p style="color:#c00">
No se pudo completar el pedido.<br>
${escapeHtml(error.message)}
</p>`;
}
     }
     function setRating(rating){
selectedRating=rating;
document.querySelectorAll("#ratingButtons .size-btn").forEach((b,i)=>{
b.classList.toggle("active",i+1===rating);
});
}

function addReview(){
const name=document.getElementById("reviewName").value.trim();
const text=document.getElementById("reviewText").value.trim();

if(!name||!text||!selectedRating){
alert("Completa tu nombre, opinión y valoración.");
return;
}

const reviews=JSON.parse(
localStorage.getItem("vibelevel_reviews")||"[]"
);

reviews.unshift({
name:name,
text:text,
rating:selectedRating,
date:new Date().toLocaleDateString("es-ES")
});

localStorage.setItem(
"vibelevel_reviews",
JSON.stringify(reviews)
);

document.getElementById("reviewName").value="";
document.getElementById("reviewText").value="";
selectedRating=0;

document.querySelectorAll("#ratingButtons .size-btn")
.forEach(b=>b.classList.remove("active"));

loadReviews();
}

function loadReviews(){
const reviews=JSON.parse(
localStorage.getItem("vibelevel_reviews")||"[]"
);

const box=document.getElementById("reviewsList");

if(!reviews.length){
box.innerHTML="<p>Aún no hay reseñas.</p>";
return;
}

box.innerHTML=reviews.map(r=>`
<div class="review">
<strong>${escapeHtml(r.name)}</strong>
<div class="stars">${"★".repeat(Number(r.rating||0))}</div>
<p>${escapeHtml(r.text)}</p>
<small>${escapeHtml(r.date||"")}</small>
</div>
`).join("");
}
