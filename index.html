<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#000">
<title>VibeLevel Worldwide</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
header{position:sticky;top:0;z-index:50;background:#050505;border-bottom:1px solid #222;padding:15px 20px}
.nav{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}
.logo{font-weight:900;letter-spacing:4px;font-size:20px}
.navlinks{display:flex;gap:20px;font-size:12px;letter-spacing:1px}
.cartBtn{background:#fff;color:#000;border:0;padding:10px 15px;font-weight:bold}
.hero{min-height:430px;display:flex;align-items:center;justify-content:center;text-align:center;padding:60px 20px;border-bottom:1px solid #222;background:radial-gradient(circle at center,#191919 0,#050505 55%)}
.hero h1{font-size:clamp(45px,10vw,100px);margin:0;letter-spacing:8px;font-weight:900}
.hero p{color:#999;letter-spacing:3px}
.wrap{max-width:1200px;margin:auto;padding:35px 20px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:25px}
.search{flex:1;min-width:220px;padding:14px;background:#111;border:1px solid #333;color:#fff}
.cat{padding:14px;background:#111;color:#fff;border:1px solid #333}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:#0d0d0d;border:1px solid #222;position:relative;overflow:hidden}
.cardImg{width:100%;aspect-ratio:1/1;object-fit:cover;background:#111;display:block}
.cardBody{padding:15px}
.card h3{font-size:14px;margin:0 0 10px;letter-spacing:1px}
.desc{font-size:12px;color:#888;min-height:32px}
.price{font-size:16px;font-weight:bold;margin-top:12px}
.old{text-decoration:line-through;color:#666;font-size:12px;margin-left:6px}
.badges{position:absolute;top:10px;left:10px;display:flex;gap:5px}
.badge{background:#fff;color:#000;padding:5px 7px;font-size:9px;font-weight:bold}
.fav{position:absolute;top:10px;right:10px;width:34px;height:34px;border:1px solid #555;background:#000;color:#fff;border-radius:50%}
.fav.active{background:#fff;color:#000}
.cardActions{display:flex;gap:7px;margin-top:15px}
.cardActions button{flex:1;padding:11px;border:1px solid #444;background:#fff;color:#000;font-weight:bold;font-size:11px}
.cardActions .more{background:#111;color:#fff}
.empty{text-align:center;padding:50px;color:#777;grid-column:1/-1}
.loading{text-align:center;padding:60px;color:#777}
.sectionTitle{letter-spacing:4px;margin-bottom:20px}
footer{border-top:1px solid #222;margin-top:50px;padding:40px 20px;text-align:center;color:#666;font-size:11px;letter-spacing:1px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;padding:20px;overflow:auto}
.modal.show{display:flex;align-items:center;justify-content:center}
.modalBox{width:min(700px,100%);background:#111;border:1px solid #333;padding:20px;position:relative}
.close{position:absolute;right:15px;top:15px;background:#222;color:#fff;border:1px solid #444;width:35px;height:35px}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:25px}
.detail img{width:100%;background:#050505}
.detail h2{font-size:28px;margin-top:0}
.detail p{color:#aaa;line-height:1.6;font-size:13px}
.detailPrice{font-size:22px;font-weight:bold;margin:20px 0}
.sizes{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}
.size{background:#111;color:#fff;border:1px solid #444;padding:10px 14px}
.size.selected{background:#fff;color:#000}
.buy{width:100%;padding:15px;background:#fff;color:#000;border:0;font-weight:bold;margin-top:10px}
.cartPanel{width:min(600px,100%);background:#111;border:1px solid #333;padding:20px}
.cartItem{display:flex;gap:12px;padding:15px 0;border-bottom:1px solid #292929}
.cartItem img{width:70px;height:70px;object-fit:cover;background:#000}
.cartInfo{flex:1}
.cartInfo h4{margin:0 0 7px;font-size:13px}
.qty{display:flex;align-items:center;gap:8px;margin-top:8px}
.qty button{width:28px;height:28px;background:#222;color:#fff;border:1px solid #444}
.remove{background:none!important;border:0!important;color:#888!important}
.summary{border-top:1px solid #333;margin-top:20px;padding-top:20px}
.total{font-size:20px;font-weight:bold;margin:12px 0}
.form{display:grid;gap:10px;margin-top:15px}
.form input,.form select,.form textarea{width:100%;padding:13px;background:#fff;color:#000;border:0}
.form textarea{min-height:80px}
.shipping{margin-top:15px}
.shipping label{display:block;border:1px solid #333;padding:12px;margin:7px 0;cursor:pointer}
.shipping input{margin-right:8px}
.stars{display:flex;gap:5px;margin:15px 0}
.star{font-size:28px;color:#444;cursor:pointer}
.star.active{color:#fff}
.reviewBox{border-top:1px solid #333;margin-top:25px;padding-top:20px}
.review{padding:12px 0;border-bottom:1px solid #222;font-size:12px;color:#aaa}
.review strong{color:#fff}
@media(max-width:900px){.products{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){.navlinks{display:none}.products{grid-template-columns:repeat(2,1fr);gap:10px}.wrap{padding:25px 12px}.hero{min-height:350px}.detail{grid-template-columns:1fr}.cardBody{padding:11px}.cardActions{flex-direction:column}.cardActions button{width:100%}}
</style>
</head>
<body>

<header>
<div class="nav">
<a href="#" class="logo">VIBELEVEL</a>
<div class="navlinks">
<a href="#coleccion">COLECCIÓN</a>
<a href="#reviews">REVIEWS</a>
</div>
<button class="cartBtn" onclick="openCart()">🛒 CARRITO (<span id="cartCount">0</span>)</button>
</div>
</header>

<section class="hero">
<div>
<h1>VIBELEVEL</h1>
<p>WORLDWIDE STREETWEAR</p>
</div>
</section>

<main class="wrap" id="coleccion">
<h2 class="sectionTitle">COLECCIÓN</h2>
<div class="tools">
<input class="search" id="search" placeholder="Buscar producto...">
<select class="cat" id="category">
<option value="ALL">TODOS</option>
<option value="TEES">TEES</option>
<option value="HOODIES">HOODIES</option>
<option value="BOTTOMS">BOTTOMS</option>
<option value="JACKETS">JACKETS</option>
<option value="ACCESSORIES">ACCESSORIES</option>
</select>
</div>
<div id="products" class="products">
<div class="loading">CARGANDO PRODUCTOS...</div>
</div>
</main>

<section class="wrap" id="reviews">
<h2 class="sectionTitle">REVIEWS</h2>
<div id="reviewsList"></div>
</section>

<footer>VIBELEVEL WORLDWIDE © 2026</footer>

<div class="modal" id="detailModal">
<div class="modalBox">
<button class="close" onclick="closeModal('detailModal')">×</button>
<div id="detailContent"></div>
</div>
</div>

<div class="modal" id="cartModal">
<div class="cartPanel">
<button class="close" onclick="closeModal('cartModal')">×</button>
<h2>CARRITO</h2>
<div id="cartItems"></div>
<div class="summary">
<div>Subtotal: <b id="subtotal">0 XAF</b></div>
<div class="shipping">
<b>ENVÍO</b>
<label><input type="radio" name="shipping" value="0" checked onchange="updateCart()"> Recogida / entrega local — 0 XAF</label>
<label><input type="radio" name="shipping" value="2000" onchange="updateCart()"> Envío estándar — 2.000 XAF</label>
<label><input type="radio" name="shipping" value="5000" onchange="updateCart()"> Envío express — 5.000 XAF</label>
</div>
<div class="total">TOTAL: <span id="total">0 XAF</span></div>
<div class="form">
<input id="customerName" placeholder="Nombre">
<input id="customerPhone" placeholder="Teléfono">
<textarea id="customerAddress" placeholder="Dirección / lugar de entrega"></textarea>
</div>
<button class="buy" onclick="checkoutWhatsApp()">COMPRAR POR WHATSAPP</button>
</div>
</div>
</div>

<script>
const SUPABASE_URL="https://yqlyxnlheoiftxhpteyb.supabase.co";
const SUPABASE_KEY="sb_publishable_5VLYWrFAgEXJkWhdErOikg_vHOKIHyb";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const WHATSAPP="240555626619";
let products=[];
let cart=JSON.parse(localStorage.getItem("vibelevel_cart")||"[]");
let favorites=JSON.parse(localStorage.getItem("vibelevel_favorites")||"[]");
let selectedProduct=null;
let selectedSize="";
let selectedRating=0;

function money(n){return Number(n||0).toLocaleString("es-ES")+" XAF"}
function saveCart(){localStorage.setItem("vibelevel_cart",JSON.stringify(cart));updateCartCount()}
function updateCartCount(){document.getElementById("cartCount").textContent=cart.reduce((a,b)=>a+b.qty,0)}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

async function loadProducts(){
const box=document.getElementById("products");
try{
const {data,error}=await db.from("products").select("*").order("created_at",{ascending:false});
if(error){box.innerHTML="<div class='empty'>ERROR: "+escapeHtml(error.message)+"</div>";return}
products=data||[];
renderProducts();
}catch(e){box.innerHTML="<div class='empty'>ERROR: "+escapeHtml(e.message)+"</div>"}
}

function renderProducts(){
const box=document.getElementById("products");
const q=document.getElementById("search").value.toLowerCase().trim();
const cat=document.getElementById("category").value;
const list=products.filter(p=>(cat==="ALL"||p.category===cat)&&((p.name||"").toLowerCase().includes(q)||(p.description||"").toLowerCase().includes(q)));
if(!list.length){box.innerHTML="<div class='empty'>NO SE ENCONTRARON PRODUCTOS.</div>";return}
box.innerHTML=list.map(p=>{
const fav=favorites.includes(String(p.id));
return `<article class="card">
<div class="badges">${p.is_new?'<span class="badge">NEW</span>':''}${p.is_sale?'<span class="badge">SALE</span>':''}</div>
<button class="fav ${fav?'active':''}" onclick="toggleFavorite('${p.id}')">${fav?'♥':'♡'}</button>
<img class="cardImg" src="${escapeHtml(p.image_url||"")}" alt="${escapeHtml(p.name)}" onerror="this.style.display='none'">
<div class="cardBody">
<h3>${escapeHtml(p.name)}</h3>
<div class="desc">${escapeHtml(p.description||"")}</div>
<div class="price">${money(p.price)} ${p.old_price?`<span class="old">${money(p.old_price)}</span>`:""}</div>
<div class="cardActions">
<button onclick="openProduct('${p.id}')">VER PRODUCTO</button>
<button class="more" onclick="addToCart('${p.id}')">${p.sold_out||Number(p.stock)<=0?'AGOTADO':'AÑADIR AL CARRITO'}</button>
</div>
</div>
</article>`
}).join("")
}

function toggleFavorite(id){
id=String(id);
if(favorites.includes(id))favorites=favorites.filter(x=>x!==id);else favorites.push(id);
localStorage.setItem("vibelevel_favorites",JSON.stringify(favorites));
renderProducts();
}

function openProduct(id){
selectedProduct=products.find(p=>String(p.id)===String(id));
if(!selectedProduct)return;
selectedSize="";
document.getElementById("detailContent").innerHTML=`
<div class="detail">
<div><img src="${escapeHtml(selectedProduct.image_url||"")}" alt="${escapeHtml(selectedProduct.name)}"></div>
<div>
<h2>${escapeHtml(selectedProduct.name)}</h2>
<p>${escapeHtml(selectedProduct.description||"Sin descripción.")}</p>
<div class="detailPrice">${money(selectedProduct.price)} ${selectedProduct.old_price?`<span class="old">${money(selectedProduct.old_price)}</span>`:""}</div>
<b>TALLAS</b>
<div class="sizes">${String(selectedProduct.sizes||"S,M,L,XL").split(",").map(s=>`<button class="size" onclick="selectSize(this,'${escapeHtml(s.trim())}')">${escapeHtml(s.trim())}</button>`).join("")}</div>
<p>Stock disponible: ${Number(selectedProduct.stock||0)}</p>
<button class="buy" onclick="addSelectedToCart()">AÑADIR AL CARRITO</button>
<div class="reviewBox">
<b>VALORA ESTE PRODUCTO</b>
<div class="stars" id="detailStars">${[1,2,3,4,5].map(i=>`<span class="star" onclick="rateProduct(${i})">★</span>`).join("")}</div>
<button class="buy" onclick="submitReview()">ENVIAR VALORACIÓN</button>
</div>
</div>
</div>`;
document.getElementById("detailModal").classList.add("show");
}

function selectSize(el,size){
selectedSize=size;
document.querySelectorAll(".size").forEach(x=>x.classList.remove("selected"));
el.classList.add("selected");
}

function addSelectedToCart(){
if(!selectedProduct)return;
addToCart(selectedProduct.id,selectedSize);
closeModal("detailModal");
openCart();
}

function addToCart(id,size=""){
const p=products.find(x=>String(x.id)===String(id));
if(!p||p.sold_out||Number(p.stock)<=0){alert("Este producto está agotado.");return}
if(!size&&p.sizes)size=String(p.sizes).split(",")[0].trim();
const key=String(id)+"_"+size;
const item=cart.find(x=>x.key===key);
if(item)item.qty++;
else cart.push({key,id:String(id),qty:1,size:size});
saveCart();
}

function changeQty(key,n){
const item=cart.find(x=>x.key===key);
if(!item)return;
item.qty+=n;
if(item.qty<=0)cart=cart.filter(x=>x.key!==key);
saveCart();
updateCart();
}

function removeItem(key){cart=cart.filter(x=>x.key!==key);saveCart();updateCart()}

function updateCart(){
const box=document.getElementById("cartItems");
if(!cart.length){
box.innerHTML="<p style='color:#777;text-align:center;padding:30px'>TU CARRITO ESTÁ VACÍO.</p>";
document.getElementById("subtotal").textContent="0 XAF";
document.getElementById("total").textContent="0 XAF";
return;
}
let sub=0;
box.innerHTML=cart.map(item=>{
const p=products.find(x=>String(x.id)===String(item.id));
if(!p)return "";
const line=Number(p.price)*item.qty;sub+=line;
return `<div class="cartItem">
<img src="${escapeHtml(p.image_url||"")}">
<div class="cartInfo">
<h4>${escapeHtml(p.name)}</h4>
<div>${money(p.price)} · Talla: ${escapeHtml(item.size||"-")}</div>
<div class="qty">
<button onclick="changeQty('${item.key}',-1)">−</button><b>${item.qty}</b><button onclick="changeQty('${item.key}',1)">+</button>
<button class="remove" onclick="removeItem('${item.key}')">ELIMINAR</button>
</div>
</div></div>`
}).join("");
const shipping=Number(document.querySelector('input[name="shipping"]:checked')?.value||0);
document.getElementById("subtotal").textContent=money(sub);
document.getElementById("total").textContent=money(sub+shipping);
}

function openCart(){updateCart();document.getElementById("cartModal").classList.add("show")}
function closeModal(id){document.getElementById(id).classList.remove("show")}

function checkoutWhatsApp(){
if(!cart.length){alert("El carrito está vacío.");return}
const name=document.getElementById("customerName").value.trim();
const phone=document.getElementById("customerPhone").value.trim();
const address=document.getElementById("customerAddress").value.trim();
if(!name||!phone||!address){alert("Completa nombre, teléfono y dirección.");return}
let sub=0;
let text="VIBELEVEL WORLDWIDE%0A%0A*NUEVO PEDIDO*%0A";
cart.forEach(item=>{
const p=products.find(x=>String(x.id)===String(item.id));
if(p){sub+=Number(p.price)*item.qty;text+=`%0A• ${encodeURIComponent(p.name)} x${item.qty} — ${encodeURIComponent(money(Number(p.price)*item.qty))}%0ATalla: ${encodeURIComponent(item.size||"-")}`}
});
const shipping=Number(document.querySelector('input[name="shipping"]:checked')?.value||0);
const total=sub+shipping;
text+=`%0A%0ASubtotal: ${encodeURIComponent(money(sub))}%0AEnvío: ${encodeURIComponent(money(shipping))}%0A*TOTAL: ${encodeURIComponent(money(total))}*%0A%0ANombre: ${encodeURIComponent(name)}%0ATeléfono: ${encodeURIComponent(phone)}%0ADirección: ${encodeURIComponent(address)}`;
window.open("https://wa.me/"+WHATSAPP+"?text="+text,"_blank");
}

function rateProduct(n){
selectedRating=n;
document.querySelectorAll("#detailStars .star").forEach((s,i)=>s.classList.toggle("active",i<n));
}

async function submitReview(){
if(!selectedProduct||!selectedRating){alert("Selecciona las estrellas primero.");return}
let reviews=JSON.parse(localStorage.getItem("vibelevel_reviews")||"[]");
reviews.push({product_id:String(selectedProduct.id),product:selectedProduct.name,rating:selectedRating,date:new Date().toLocaleDateString("es-ES")});
localStorage.setItem("vibelevel_reviews",JSON.stringify(reviews));
alert("¡Gracias por tu valoración!");
loadReviews();
}

function loadReviews(){
const reviews=JSON.parse(localStorage.getItem("vibelevel_reviews")||"[]");
const box=document.getElementById("reviewsList");
if(!reviews.length){box.innerHTML="<p style='color:#777'>Todavía no hay valoraciones.</p>";return}
box.innerHTML=reviews.slice().reverse().map(r=>`<div class="review"><strong>${escapeHtml(r.product)}</strong><br>${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}<br>${r.date}</div>`).join("");
}

document.getElementById("search").addEventListener("input",renderProducts);
document.getElementById("category").addEventListener("change",renderProducts);
window.addEventListener("storage",()=>{cart=JSON.parse(localStorage.getItem("vibelevel_cart")||"[]");updateCartCount()});
updateCartCount();
loadReviews();
loadProducts();

setInterval(loadProducts,30000);
</script>
</body>
  </html>
